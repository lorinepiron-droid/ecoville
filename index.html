<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Écoville</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: univers BD — ciel animé, cases encrées à ombre dure ; écran = 6 quartiers illustrés + tableau des équipes ; téléphone = manette plein écran */
:root {
  color-scheme: light;
  --ink: #1d1d1b;
  --paper: #fffdf6;
  --sky1: #7fd0ff;
  --sky2: #dff5ff;
  --sun: #ffd23f;
  --leaf: #3fa34d;
  --leaf-d: #2a7a37;
  --red: #e4572e;
  --muted: #5b6470;
  --c-dech: #2fa35a; --c-plast: #1f86c9; --c-tel: #8a55c9; --c-ia: #d4447f; --c-mode: #ee7a2b; --c-alim: #c99a0b;
  --a1: #ef4b4b; --a2: #2f78e0; --a3: #f5b51b; --a4: #2fae62;
  --comic: "Bangers", "Impact", "Arial Black", sans-serif;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --shadow: 5px 5px 0 var(--ink);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { min-height: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
body {
  margin: 0; color: var(--ink); font-family: var(--body); font-weight: 600; font-size: 17px; line-height: 1.4;
  background-color: var(--sky2);
  background-image: radial-gradient(rgba(29,29,27,0.07) 1.2px, transparent 1.3px), linear-gradient(180deg, var(--sky1), var(--sky2) 70%);
  background-size: 14px 14px, 100% 100%; background-attachment: fixed;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 40px;
  overflow-x: hidden;
}
.bgclouds { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.bgclouds svg { position: absolute; width: 220px; opacity: 0.9; animation: sail linear infinite; }
@keyframes sail { from { transform: translateX(-260px); } to { transform: translateX(calc(100vw + 40px)); } }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
h1, h2, h3 { margin: 0; line-height: 1.05; font-family: var(--display); font-weight: 400; text-wrap: balance; }
.panel { background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; min-width: 0; }
.btn { background: var(--sun); color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--ink); padding: 12px 24px; font-family: var(--display); font-size: 1.25rem; letter-spacing: 0.02em; transition: transform 0.08s, box-shadow 0.08s; }
.btn:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
.btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.green { background: var(--leaf); color: #fff; }
.btn.white { background: #fff; }
.btn.small { padding: 7px 14px; font-size: 1rem; box-shadow: 3px 3px 0 var(--ink); }
.btn.big { font-size: 1.6rem; padding: 14px 34px; }
.wrap { position: relative; z-index: 1; max-width: 1440px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.label { font-family: var(--comic); font-size: 1.05rem; letter-spacing: 0.06em; }
.hint { font-size: 0.9rem; color: var(--muted); margin: 0; }

/* ---------- logo ---------- */
.logo { font-family: var(--comic); font-weight: 400; letter-spacing: 0.04em; line-height: 0.9; color: var(--sun);
  -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--ink); transform: rotate(-3deg); display: inline-block; }
.logo .v { color: #7bd389; }

/* ---------- barre du haut ---------- */
.topbar { display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: center; justify-content: space-between; }
.topbar .logo { font-size: clamp(2.2rem, 4.4vw, 3.2rem); }
.citymeter { display: flex; align-items: center; gap: 10px; flex: 1 1 300px; max-width: 560px; background: #fff; border: 3px solid var(--ink); border-radius: 40px; padding: 6px 14px 6px 6px; box-shadow: 4px 4px 0 var(--ink); }
.citymeter svg { width: 40px; height: 40px; flex: none; }
.bar { flex: 1; height: 20px; border: 3px solid var(--ink); border-radius: 12px; background: #e9e3d6; overflow: hidden; }
.bar div { height: 100%; background: repeating-linear-gradient(-45deg, #5cc36b 0 10px, #4caf50 10px 20px); border-right: 3px solid var(--ink); transition: width 1s cubic-bezier(.2,1.4,.4,1); }
.pct { font-family: var(--comic); font-size: 1.6rem; letter-spacing: 0.04em; min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
.badge { font-family: var(--comic); font-size: 1.4rem; letter-spacing: 0.05em; background: var(--red); color: #fff; border: 3px solid var(--ink); border-radius: 12px; padding: 4px 14px; box-shadow: 3px 3px 0 var(--ink); transform: rotate(2deg); }
.iconbtn { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--ink); background: #fff; box-shadow: 3px 3px 0 var(--ink); display: grid; place-items: center; padding: 0; }
.iconbtn svg { width: 24px; height: 24px; }

/* ---------- tuiles quartier ---------- */
.city { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.tile { position: relative; padding: 0; border: 3px solid var(--ink); border-radius: 16px; background: var(--paper); box-shadow: var(--shadow); overflow: hidden; text-align: left; display: flex; flex-direction: column; min-width: 0; transition: transform 0.15s; }
button.tile:not(:disabled):hover { transform: translate(-2px, -3px) rotate(-0.6deg); box-shadow: 8px 8px 0 var(--ink); }
button.tile:not(:disabled):active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
button.tile:disabled { cursor: default; }
.tile.chosen { outline: 5px solid var(--sun); outline-offset: 3px; }
.scene { position: relative; aspect-ratio: 16 / 9; border-bottom: 3px solid var(--ink); overflow: hidden; max-width: 100%; }
.scene svg { display: block; width: 100%; height: 100%; }
.tinfo { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; color: #fff; }
.tname { font-family: var(--display); font-size: clamp(1.1rem, 1.7vw, 1.45rem); -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; text-shadow: 2px 2px 0 var(--ink); }
.tsub { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 800; font-size: 0.85rem; }
.tsub .pcts { font-family: var(--comic); font-size: 1.3rem; letter-spacing: 0.04em; text-shadow: 2px 2px 0 var(--ink); }
.jauge { height: 14px; border: 3px solid var(--ink); border-radius: 9px; background: rgba(255,255,255,0.35); overflow: hidden; }
.jauge div { height: 100%; background: #fff; transition: width 1s cubic-bezier(.2,1.4,.4,1); }
.stamp { position: absolute; top: 10px; left: 10px; font-family: var(--comic); font-size: 1.05rem; letter-spacing: 0.06em; padding: 2px 10px; border: 3px solid var(--ink); border-radius: 8px; transform: rotate(-6deg); box-shadow: 2px 2px 0 var(--ink); }
.stamp.p { background: #ff6b4a; color: #fff; } .stamp.c { background: var(--sun); } .stamp.r { background: #7bd389; }
.delta { position: absolute; right: 10px; top: 10px; font-family: var(--comic); font-size: 1.6rem; color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; animation: pop 0.6s cubic-bezier(.2,1.6,.4,1) both, floaty 2s 0.6s ease-in-out infinite alternate; }
@keyframes pop { from { transform: scale(0) rotate(-20deg); } to { transform: scale(1) rotate(4deg); } }
@keyframes floaty { to { transform: translateY(-5px) rotate(-3deg); } }

/* contenu animé des scènes : --h = santé (0..1), --b = 1 si restauré */
.sk { opacity: var(--h); transition: opacity 1.2s; }
.cl { opacity: calc((var(--h) - 0.3) * 2); transition: opacity 1.2s; }
.dt { opacity: calc((0.8 - var(--h)) * 2); transition: opacity 1.2s; }
.bl { opacity: var(--b); transition: opacity 1.2s; }
.drift { animation: drift 7s ease-in-out infinite alternate; }
.drift2 { animation: drift 11s ease-in-out infinite alternate-reverse; }
@keyframes drift { from { transform: translateX(-14px); } to { transform: translateX(14px); } }
.spin { animation: spin 3s linear infinite; }
.spinslow { animation: spin 18s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.wave { animation: wave 2.4s linear infinite; }
@keyframes wave { to { transform: translateX(-40px); } }
.bob { animation: bob 2.6s ease-in-out infinite alternate; }
.bob2 { animation: bob 1.9s ease-in-out infinite alternate-reverse; }
@keyframes bob { from { transform: translateY(-2px) rotate(-1.5deg); } to { transform: translateY(3px) rotate(1.5deg); } }
.blink { animation: blink 1.4s steps(2, jump-none) infinite; }
@keyframes blink { 50% { opacity: 0.25; } }
.rise { animation: rise 3.2s ease-out infinite; }
@keyframes rise { from { transform: translateY(0) scale(0.6); opacity: 0.9; } to { transform: translateY(-34px) scale(1.4); opacity: 0; } }
.buzz { animation: buzz 0.5s steps(3) infinite alternate; }
@keyframes buzz { 0% { transform: translate(0, 0); } 50% { transform: translate(3px, -2px); } 100% { transform: translate(-2px, 2px); } }
.jump { animation: jump 2.8s ease-in-out infinite; }
@keyframes jump { 0%, 55% { transform: translate(0, 24px) rotate(0); opacity: 0; } 60% { opacity: 1; } 75% { transform: translate(18px, -14px) rotate(-30deg); } 95% { transform: translate(36px, 24px) rotate(-120deg); opacity: 1; } 100% { opacity: 0; } }
.fly { animation: fly 6s ease-in-out infinite alternate; }
@keyframes fly { from { transform: translate(-10px, 4px); } to { transform: translate(24px, -6px); } }
.twinkle { animation: twinkle 1.6s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: 0.2; } to { opacity: 1; } }

/* ---------- mascotte ---------- */
.mascot { width: 96px; height: 96px; flex: none; animation: hop 1.6s ease-in-out infinite; }
.mascot.sm { width: 64px; height: 64px; }
@keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px) rotate(-3deg); } }
.bubble { position: relative; background: #fff; border: 3px solid var(--ink); border-radius: 18px; padding: 12px 16px; box-shadow: 4px 4px 0 var(--ink); font-weight: 800; }
.bubble::before { content: ""; position: absolute; left: -16px; top: 22px; border: 10px solid transparent; border-right: 14px solid var(--ink); }
.bubble::after { content: ""; position: absolute; left: -10px; top: 24px; border: 8px solid transparent; border-right: 11px solid #fff; }
.talk { display: flex; align-items: center; gap: 18px; }

/* ---------- accueil ---------- */
.hero { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px; }
.hero .logo { font-size: clamp(3.4rem, 9vw, 6.5rem); }
.hero .tagline { font-family: var(--display); font-size: clamp(1.1rem, 2vw, 1.5rem); margin-top: 6px; }
.lobby { display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.2fr); gap: 20px; align-items: start; }
.join { display: grid; grid-template-columns: minmax(0, 230px) minmax(0, 1fr); gap: 20px; align-items: center; }
.qr { background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 8px; width: 100%; max-width: 230px; aspect-ratio: 1; display: grid; place-items: center; box-shadow: 4px 4px 0 var(--ink); transform: rotate(-2deg); }
.qr svg { width: 100%; height: auto; display: block; }
.code { font-family: var(--comic); font-size: clamp(3rem, 6vw, 4.4rem); letter-spacing: 0.12em; color: var(--red); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink); line-height: 1; }
.url { font-size: 0.8rem; color: var(--muted); overflow-wrap: anywhere; }
.netnote { border: 3px dashed var(--ink); border-radius: 12px; padding: 12px 14px; background: #fff4d1; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-family: var(--comic); letter-spacing: 0.06em; font-size: 1.05rem; }
select, input[type=text] { font: inherit; font-weight: 800; padding: 9px 10px; border-radius: 10px; border: 3px solid var(--ink); background: #fff; color: var(--ink); width: 100%; min-width: 0; }
.teamlist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.teamedit { display: flex; align-items: center; gap: 8px; min-width: 0; }
.avatar { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--ink); display: grid; place-items: center; flex: none; font-family: var(--comic); font-size: 1.3rem; color: #fff; -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; box-shadow: 2px 2px 0 var(--ink); }
.joined { font-family: var(--comic); letter-spacing: 0.05em; font-size: 0.9rem; flex: none; padding: 2px 8px; border-radius: 8px; border: 2px solid var(--ink); background: #eee; }
.joined.on { background: #7bd389; }
.steps { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; counter-reset: s; }
.steps li { display: flex; gap: 10px; align-items: center; font-weight: 800; }
.steps li::before { counter-increment: s; content: counter(s); width: 28px; height: 28px; flex: none; border-radius: 50%; border: 2px solid var(--ink); background: var(--sun); display: grid; place-items: center; font-family: var(--comic); font-size: 1rem; }

/* ---------- jeu ---------- */
.game { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.stage { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.prompt { font-family: var(--display); font-size: clamp(1.3rem, 2.4vw, 1.9rem); }
.qwrap { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.5fr); gap: 18px; align-items: stretch; }
.qwrap .tile { align-self: start; }
.qcard { position: relative; display: flex; flex-direction: column; gap: 14px; }
.qtop { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.qkind { font-family: var(--comic); font-size: 1.2rem; letter-spacing: 0.06em; color: #fff; background: var(--dom); border: 3px solid var(--ink); border-radius: 10px; padding: 2px 12px; box-shadow: 3px 3px 0 var(--ink); transform: rotate(-2deg); display: inline-block; }
.qtext { font-family: var(--display); font-size: clamp(1.5rem, 3vw, 2.4rem); line-height: 1.15; margin: 0; }
.ring { width: 86px; height: 86px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--comic); font-size: 2rem; }
.ring.hurry { animation: shake 0.3s linear infinite; }
@keyframes shake { 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.opt { position: relative; display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 14px; border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); color: #fff; font-weight: 900; font-size: clamp(1.05rem, 1.8vw, 1.35rem); min-width: 0; text-shadow: 1px 1px 0 rgba(0,0,0,0.35); transition: opacity 0.4s, transform 0.4s, filter 0.4s; }
.opt .k { width: 2.1em; height: 2.1em; border-radius: 50%; display: grid; place-items: center; background: #fff; color: var(--ink); border: 3px solid var(--ink); font-family: var(--comic); font-size: 1.15em; flex: none; text-shadow: none; }
.k1 { background: var(--a1); } .k2 { background: var(--a2); } .k3 { background: var(--a3); } .k4 { background: var(--a4); }
.opt.dim { opacity: 0.35; filter: grayscale(1); transform: scale(0.97); }
.opt.right { animation: wiggle 0.6s ease-in-out 2; outline: 5px solid var(--sun); outline-offset: 2px; }
.opt.right::after { content: "✔"; position: absolute; right: -10px; top: -14px; width: 40px; height: 40px; border-radius: 50%; background: #7bd389; border: 3px solid var(--ink); display: grid; place-items: center; font-size: 1.3rem; color: var(--ink); text-shadow: none; }
@keyframes wiggle { 25% { transform: rotate(-2deg) scale(1.03); } 75% { transform: rotate(2deg) scale(1.03); } }
.burst { position: relative; display: grid; place-items: center; width: 150px; height: 150px; flex: none; animation: pop 0.5s cubic-bezier(.2,1.6,.4,1) both; }
.burst svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.burst span { position: relative; font-family: var(--comic); font-size: 1.5rem; text-align: center; line-height: 1; transform: rotate(-6deg); }
.burst span b { display: block; font-size: 2.4rem; font-weight: 400; }
.revealrow { display: flex; gap: 16px; align-items: center; }
.expl { background: #fff4d1; border: 3px solid var(--ink); border-radius: 14px; padding: 12px 16px; font-size: 1.08rem; flex: 1; min-width: 0; }

.side { display: flex; flex-direction: column; gap: 14px; }
.side h2 { font-family: var(--comic); letter-spacing: 0.05em; font-size: 1.8rem; }
.teams { display: flex; flex-direction: column; gap: 10px; }
.team { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 8px 10px; border-radius: 14px; border: 3px solid var(--ink); background: #fff; position: relative; transition: transform 0.3s; }
.team.chooser { background: #fff4d1; }
.team .avatar { grid-row: span 2; }
.team .nm { font-family: var(--display); font-size: 1.15rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team .sc { font-family: var(--comic); font-size: 1.7rem; letter-spacing: 0.03em; font-variant-numeric: tabular-nums; grid-row: span 2; }
.team .sub { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 0.8rem; font-weight: 800; color: var(--muted); }
.crown { position: absolute; top: -12px; left: 2px; font-family: var(--comic); font-size: 0.85rem; letter-spacing: 0.05em; background: var(--sun); border: 2px solid var(--ink); border-radius: 6px; padding: 0 6px; transform: rotate(-6deg); }
.pill { font-family: var(--comic); letter-spacing: 0.05em; font-size: 0.85rem; padding: 1px 8px; border-radius: 7px; border: 2px solid var(--ink); background: #eee; color: var(--ink); }
.pill.ok { background: #7bd389; } .pill.ko { background: #ff8a70; } .pill.wait { background: var(--sun); }
.manual { display: flex; gap: 4px; }
.manual button { width: 28px; height: 26px; border-radius: 7px; border: 2px solid var(--ink); color: #fff; font-family: var(--comic); font-size: 0.95rem; opacity: 0.35; padding: 0; }
.manual button.sel { opacity: 1; box-shadow: 2px 2px 0 var(--ink); }

.news { position: relative; display: flex; flex-direction: column; gap: 12px; background: #fff; }
.news .flash { font-family: var(--comic); font-size: 1.3rem; letter-spacing: 0.08em; background: var(--red); color: #fff; border: 3px solid var(--ink); align-self: flex-start; padding: 2px 14px; transform: rotate(-3deg); box-shadow: 3px 3px 0 var(--ink); }
.news.good .flash { background: var(--leaf); }
.news h2 { font-family: var(--comic); font-size: clamp(2.2rem, 5vw, 3.6rem); letter-spacing: 0.04em; }
.news p { font-size: 1.2rem; margin: 0; max-width: 60ch; }
.news .effect { font-family: var(--display); font-size: 1.4rem; }
.end h2 { font-family: var(--comic); font-size: clamp(2.6rem, 6vw, 4.6rem); letter-spacing: 0.04em; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--ink); }
.podium { display: flex; flex-direction: column; gap: 8px; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 30; }
.confetti i { position: absolute; top: -20px; width: 12px; height: 18px; border: 2px solid var(--ink); animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

/* ---------- histoire d'introduction ---------- */
.introwrap { display: flex; flex-direction: column; gap: 18px; }
.introhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.introhead .logo { font-size: clamp(2.2rem, 4.4vw, 3.2rem); }
.intro { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 24px; align-items: center; min-height: 62vh; }
.intro-text { display: flex; flex-direction: column; gap: 14px; position: relative; }
.intro-text .chap { position: absolute; top: -16px; left: 16px; font-family: var(--comic); letter-spacing: 0.06em; background: var(--red); color: #fff; border: 3px solid var(--ink); padding: 0 12px; transform: rotate(-3deg); box-shadow: 3px 3px 0 var(--ink); }
.ititle { font-family: var(--comic); font-size: clamp(2.2rem, 4.6vw, 3.8rem); letter-spacing: 0.04em; line-height: 1; color: var(--sun); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink); margin-top: 8px; }
.itext { font-size: clamp(1.15rem, 2vw, 1.6rem); font-weight: 800; line-height: 1.4; margin: 0; min-height: 5.6em; }
.itext .caret { display: inline-block; width: 0.5em; height: 1em; background: var(--ink); vertical-align: -0.12em; margin-left: 2px; animation: blink 0.8s steps(2, jump-none) infinite; }

  // ----- Déchets & tri -----
  {k:"dech",l:1,t:"tri",q:"Une canette de soda vide. Où va-t-elle ?",a:["Sac PMC","Bulle à verre","Papier-carton","Ordures ménagères"],e:"Les canettes sont en métal : c'est le M de PMC (Plastiques, Métaux, Cartons à boissons)."},

  {k:"dech",l:1,t:"tri",q:"Une pelure de banane. Où va-t-elle ?",a:["Déchets organiques / compost","Sac PMC","Ordures ménagères","Papier-carton"],e:"Elle se décompose en quelques semaines et devient du compost qui nourrit le sol."},

  {k:"dech",l:1,t:"qcm",q:"Que signifie le P de PMC ?",a:["Plastiques","Papiers","Piles","Produits chimiques"],e:"PMC = Plastiques, Métaux et Cartons à boissons."},
  {k:"dech",l:2,t:"vf",q:"Un verre à boire cassé va dans la bulle à verre.",v:false,e:"Seuls les bouteilles et bocaux vont dans la bulle. Vaisselle, miroirs, vitres et pyrex fondent à une autre température et gâchent le recyclage."},

  {k:"dech",l:3,t:"qcm",q:"Pourquoi composter réduit-il les gaz à effet de serre par rapport à une décharge ?",a:["Avec de l'oxygène, les déchets se décomposent sans produire beaucoup de méthane","Le compost absorbe le CO₂ de l'air","Le compost refroidit la Terre","Le compost détruit le plastique"],e:"Dans une décharge, sans oxygène, les déchets organiques produisent du méthane, un gaz à effet de serre puissant."},

  // ----- Plastique -----
  {k:"plast",l:1,t:"qcm",q:"Combien de temps une bouteille en plastique peut-elle rester dans la nature ?",a:["Plusieurs centaines d'années","Un mois","Un an","Dix ans"],e:"On l'estime souvent à environ 450 ans. Et elle ne disparaît pas vraiment : elle se fragmente en microplastiques."},
  {k:"plast",l:1,t:"qcm",q:"À partir de quoi fabrique-t-on la plupart des plastiques ?",a:["Du pétrole et du gaz","Du sable","Du bois","Du sel"],e:"Le plastique est donc lié aux énergies fossiles, du puits de pétrole jusqu'à l'incinérateur."},

  {k:"plast",l:3,t:"qcm",q:"Combien de plastique l'humanité produit-elle environ chaque année ?",a:["Plus de 400 millions de tonnes","Environ 4 millions de tonnes","Environ 40 000 tonnes","Environ 40 milliards de tonnes"],e:"La production a été multipliée par plus de 200 depuis 1950 (OCDE)."},
  {k:"plast",l:3,t:"qcm",q:"Un plastique « biosourcé » est…",a:["Fabriqué au moins en partie à partir de plantes","Forcément biodégradable dans la mer","Sans danger pour les animaux","Recyclable à l'infini"],e:"Biosourcé ne veut pas dire biodégradable : certains se comportent exactement comme du plastique classique."},

  {k:"tel",l:1,t:"qcm",q:"Quelle étape pèse le plus dans l'impact d'un smartphone sur le climat ?",a:["Sa fabrication","Sa recharge","L'envoi de SMS","Son emballage"],e:"Environ trois quarts de son empreinte carbone viennent de la fabrication : extraction des métaux, usines, transport."},
  {k:"tel",l:1,t:"qcm",q:"Quel est le geste le plus écologique pour ton téléphone ?",a:["Le garder le plus longtemps possible","En changer chaque année","Le recharger toute la nuit","Le mettre en mode avion"],e:"Une coque, une protection d'écran et une batterie remplacée peuvent prolonger sa vie de plusieurs années."},

  {k:"tel",l:2,t:"vf",q:"Un vieux téléphone qui dort dans un tiroir a encore de la valeur.",v:true,e:"Il peut être reconditionné, ou ses métaux (or, argent, cuivre) peuvent être récupérés. Dans un tiroir, il ne sert à rien."},

  {k:"ia",l:3,t:"qcm",q:"Quelle part de l'électricité mondiale les centres de données consommaient-ils en 2024 ?",a:["Environ 1,5 %","Environ 50 %","Environ 25 %","Moins de 0,001 %"],e:"Ça paraît peu, mais c'est autant qu'un pays comme la France ou le Royaume-Uni, et ça augmente vite (Agence internationale de l'énergie)."},
  {k:"ia",l:3,t:"qcm",q:"D'ici 2030, selon l'Agence internationale de l'énergie, la consommation électrique des centres de données pourrait…",a:["Environ doubler","Baisser de moitié","Rester stable","Être multipliée par 100"],e:"L'essor de l'IA est l'une des principales raisons de cette hausse."},
  {k:"ia",l:3,t:"qcm",q:"L'IA peut aussi aider l'écologie. Par exemple…",a:["Prévoir la production solaire et éolienne pour mieux gérer le réseau électrique","Supprimer le besoin de recycler","Fabriquer de l'eau potable à partir de rien","Rendre le plastique biodégradable"],e:"Elle sert aussi à suivre la déforestation par satellite. Tout dépend de l'usage qu'on en fait."},

  // ----- Fast fashion -----
  {k:"mode",l:1,t:"qcm",q:"Combien d'eau faut-il environ pour fabriquer un jean ?",a:["Environ 7 500 litres","Environ 7,5 litres","Environ 75 litres","Environ 750 000 litres"],e:"Surtout pour cultiver le coton. C'est à peu près ce qu'une personne boit en 7 ans (chiffre du PNUE)."},
  {k:"mode",l:1,t:"qcm",q:"Qu'est-ce que la fast fashion ?",a:["Des vêtements produits très vite, en masse et à bas prix, avec des collections sans cesse renouvelées","Des vêtements pour faire du sport","Des vêtements livrés en 24 h","Des vêtements en coton bio"],e:"Certaines marques sortent des milliers de nouveaux modèles chaque semaine."},
  {k:"mode",l:1,t:"qcm",q:"Le polyester, très utilisé dans les vêtements, est…",a:["Un plastique fabriqué à partir de pétrole","Une fibre naturelle","Une sorte de coton","De la laine"],e:"Plus de la moitié des fibres textiles produites dans le monde sont du polyester."},
  {k:"mode",l:1,t:"qcm",q:"Quel geste est le plus écologique pour s'habiller ?",a:["Acheter en seconde main ou échanger","Acheter un tee-shirt neuf chaque semaine","Jeter un vêtement dès qu'il a une tache","Commander plusieurs tailles et renvoyer le reste"],e:"Le vêtement le plus écologique est celui qui existe déjà. Friperies, vide-dressings et réparation comptent aussi."},
  {k:"mode",l:2,t:"qcm",q:"Que libèrent les vêtements synthétiques à chaque lavage ?",a:["Des microfibres de plastique","De l'eau potable","De l'oxygène","Rien du tout"],e:"Elles passent à travers les stations d'épuration et finissent dans les rivières et les océans."},
  {k:"mode",l:2,t:"qcm",q:"En 2013, l'effondrement du Rana Plaza au Bangladesh a tué plus de 1 100 personnes. Que fabriquaient-elles ?",a:["Des vêtements","Des téléphones","Des jouets","Des voitures"],e:"Ce drame a révélé les conditions de travail dangereuses derrière les vêtements bon marché."},
  {k:"mode",l:2,t:"qcm",q:"Pourquoi le coton conventionnel pose-t-il problème ?",a:["Il demande beaucoup d'eau et de pesticides","Il est fait de plastique","Il pousse trop vite","Il ne se lave pas"],e:"La mer d'Aral, en Asie centrale, a presque disparu en partie à cause de l'irrigation du coton."},
  {k:"mode",l:2,t:"qcm",q:"Entre 2000 et 2014, la production mondiale de vêtements a environ…",a:["Doublé","Diminué","Stagné","Été divisée par dix"],e:"Dans le même temps, on garde chaque vêtement beaucoup moins longtemps."},
  {k:"mode",l:3,t:"qcm",q:"Selon l'ONU (PNUE), l'industrie de la mode représente environ quelle part des émissions mondiales de gaz à effet de serre ?",a:["Entre 2 et 8 %","Moins de 0,1 %","Environ 50 %","Plus de 80 %"],e:"La fourchette est large car les chaînes de fabrication, très dispersées, sont difficiles à mesurer."},
  {k:"mode",l:3,t:"vf",q:"Une partie des vêtements donnés en Europe est exportée et finit parfois dans des décharges en Afrique ou au Chili.",v:true,e:"Au Ghana ou dans le désert d'Atacama, des montagnes de vêtements invendables s'accumulent. Donner ne remplace pas acheter moins."},

  // ----- Alimentation -----
  {k:"alim",l:1,t:"qcm",q:"Quel aliment émet le plus de gaz à effet de serre par kilo produit ?",a:["Le bœuf","Les lentilles","Les pommes","Les pommes de terre"],e:"Un kilo de bœuf émet des dizaines de fois plus que la même quantité de légumineuses."},
  {k:"alim",l:1,t:"qcm",q:"En Belgique, en hiver, quels légumes et fruits sont de saison ?",a:["Poireaux, choux et pommes","Fraises","Tomates","Mangues"],e:"Manger de saison évite les serres chauffées et les longs transports."},
  {k:"alim",l:1,t:"vf",q:"Environ un tiers de la nourriture produite dans le monde est perdue ou gaspillée.",v:true,e:"Dans les champs, les transports, les magasins et chez nous (FAO). Les restes peuvent souvent être cuisinés."},
  {k:"alim",l:1,t:"qcm",q:"Quel gaz à effet de serre est produit par la digestion des vaches ?",a:["Le méthane","L'hélium","Le dioxygène","La vapeur de sel"],e:"Les ruminants rejettent du méthane en rotant, ce qui pèse lourd dans l'impact de la viande et du lait."},
  {k:"alim",l:2,t:"qcm",q:"Pourquoi une tomate belge achetée en hiver peut-elle polluer plus qu'une tomate espagnole ?",a:["Elle pousse souvent dans une serre chauffée","Elle voyage plus loin","Elle est plus grosse","Elle est emballée dans du verre"],e:"Le chauffage des serres consomme beaucoup d'énergie. Le plus simple : manger les tomates en été."},
  {k:"alim",l:2,t:"qcm",q:"Quel moyen de transport des marchandises émet le plus de CO₂ par kilo et par kilomètre ?",a:["L'avion","Le bateau","Le train","La péniche"],e:"Les fruits fragiles venus de loin (certaines mangues, des asperges hors saison) voyagent parfois en avion."},
  {k:"alim",l:2,t:"qcm",q:"Quelle mention permet encore de manger un produit après la date indiquée ?",a:["« À consommer de préférence avant le »","« À consommer jusqu'au »","Les deux","Aucune"],e:"Après cette date, le goût peut changer, mais le produit reste souvent bon. « Jusqu'au » concerne la sécurité : on la respecte."},
  {k:"alim",l:3,t:"qcm",q:"Sur 100 ans, le méthane réchauffe environ combien de fois plus que la même masse de CO₂ ?",a:["Environ 30 fois","Environ 2 fois","Environ 1 000 fois","Moins que le CO₂"],e:"Le GIEC donne environ 27 à 30 fois. Mais il reste moins longtemps dans l'atmosphère que le CO₂."},
  {k:"alim",l:3,t:"qcm",q:"Pour réduire l'empreinte carbone de son alimentation, quel geste pèse le plus ?",a:["Manger moins de viande rouge","Choisir des sacs en papier","Boire de l'eau en bouteille","Ne manger que des surgelés"],e:"Ce que l'on mange compte plus que la distance parcourue, sauf pour les produits venus en avion."},
  // ===== Nouvelles questions (version 7) =====
  {k:"dech",l:1,t:"tri",q:"Un pot de yaourt vide en plastique. Où va-t-il ?",a:["Sac PMC", "Papier-carton", "Déchets organiques", "Bulle à verre"],e:"Depuis le « nouveau sac bleu », presque tous les emballages en plastique vont dans le PMC : pots, barquettes, films et sachets."},
  {k:"dech",l:1,t:"tri",q:"Une boîte de céréales vide, en carton. Où va-t-elle ?",a:["Papier-carton", "Sac PMC", "Ordures ménagères", "Déchets organiques"],e:"Le carton propre et sec se recycle avec le papier. On peut l'aplatir pour gagner de la place."},
  {k:"dech",l:1,t:"tri",q:"Une boîte de conserve vide. Où va-t-elle ?",a:["Sac PMC", "Bulle à verre", "Papier-carton", "Ordures ménagères"],e:"C'est un emballage en métal, le M de PMC. L'acier se recycle très bien grâce aux aimants des centres de tri."},
  {k:"dech",l:2,t:"tri",q:"Des médicaments périmés. Où faut-il les rapporter ?",a:["À la pharmacie", "Dans le sac PMC", "Dans les ordures ménagères", "Dans les toilettes"],e:"Les pharmacies les reprennent gratuitement. Jetés dans les toilettes, ils polluent les rivières."},
  {k:"dech",l:2,t:"tri",q:"De l'huile de friture usagée. Où va-t-elle ?",a:["Au recyparc ou dans un point de collecte", "Dans l'évier", "Dans les déchets organiques", "Dans le sac PMC"],e:"Versée dans l'évier, elle bouche les canalisations et pollue l'eau. Collectée, elle est transformée, par exemple en biocarburant."},
  {k:"dech",l:2,t:"tri",q:"Une ampoule LED qui ne fonctionne plus. Où va-t-elle ?",a:["Dans un point de collecte Recupel ou au recyparc", "Dans la bulle à verre", "Dans les ordures ménagères", "Dans le sac PMC"],e:"Les LED contiennent des composants électroniques. Les ampoules ne vont jamais dans la bulle à verre."},
  {k:"dech",l:2,t:"tri",q:"Un flacon vide de produit ménager avec un bouchon de sécurité pour enfants. Où va-t-il ?",a:["Au recyparc, avec les déchets chimiques", "Dans le sac PMC", "Dans la bulle à verre", "Dans le papier-carton"],e:"Les emballages avec bouchon de sécurité ou pictogramme de danger peuvent contenir des restes dangereux : ils sont interdits dans le PMC."},
  {k:"dech",l:2,t:"qcm",q:"Avant de mettre un emballage dans le sac PMC, que faut-il faire ?",a:["Bien le vider (égoutter, racler)", "Le laver au savon", "L'emballer dans du papier", "Le couper en petits morceaux"],e:"Un emballage bien vidé suffit. Les petits morceaux, eux, se perdent dans le centre de tri."},
  {k:"dech",l:2,t:"qcm",q:"Pourquoi y a-t-il deux bulles à verre : une pour le verre incolore et une pour le verre coloré ?",a:["Pour refaire du verre incolore, il faut du verre incolore sans couleur mélangée", "Parce que le verre coloré est plus lourd", "Pour faire moins de bruit", "Il n'y a aucune raison"],e:"Un seul tesson coloré suffit à teinter du verre incolore. Bien trier permet de recycler le verre à l'infini."},
  {k:"dech",l:2,t:"tri",q:"Un vieux t-shirt encore mettable. Que faire ?",a:["Le donner dans une bulle à vêtements ou une association", "Le jeter dans les ordures ménagères", "Le mettre dans le sac PMC", "Le mettre dans le papier-carton"],e:"Des associations comme Oxfam, Les Petits Riens ou Terre récupèrent les textiles pour les revendre ou les recycler."},
  {k:"dech",l:3,t:"qcm",q:"Que signifie « économie circulaire » ?",a:["Garder les objets et les matières en usage le plus longtemps possible (réparer, réutiliser, recycler)", "Faire circuler les camions-poubelles plus souvent", "Brûler les déchets pour produire de l'énergie", "Exporter les déchets vers d'autres pays"],e:"Elle s'oppose au modèle linéaire « extraire, fabriquer, jeter »."},
  {k:"dech",l:3,t:"qcm",q:"Qu'est-ce que la « responsabilité élargie du producteur » (REP) ?",a:["Les fabricants financent la collecte et le recyclage de leurs produits en fin de vie", "Les consommateurs paient une amende s'ils trient mal", "Les communes fabriquent les emballages", "Les magasins doivent reprendre tous les déchets"],e:"En Belgique, Fost Plus (emballages), Recupel (appareils) et Bebat (piles) sont financés par les entreprises qui mettent ces produits sur le marché."},
  {k:"dech",l:3,t:"qcm",q:"Dans la règle des 5R du zéro déchet (Bea Johnson), quel est le premier R ?",a:["Refuser", "Recycler", "Réparer", "Rendre"],e:"Refuser, Réduire, Réutiliser, Recycler, Rendre à la terre (composter). On commence par refuser ce dont on n'a pas besoin."},
  {k:"dech",l:3,t:"qcm",q:"Que produit la biométhanisation des déchets organiques ?",a:["Du biogaz pour produire de l'énergie, et un résidu qui sert d'engrais", "De l'eau potable", "Du plastique neuf", "De l'oxygène pur"],e:"Des bactéries décomposent les déchets sans oxygène. Le méthane est capté au lieu de partir dans l'air."},
  {k:"dech",l:3,t:"qcm",q:"Que signifie le logo « Point vert » (deux flèches enroulées) sur un emballage ?",a:["L'entreprise a payé une contribution au système de collecte des emballages", "L'emballage est forcément recyclable", "L'emballage est fait de matière recyclée", "L'emballage est biodégradable"],e:"Ce logo trompe souvent : il ne dit pas si l'emballage est recyclable."},
  {k:"dech",l:3,t:"qcm",q:"Que signifie le triangle de trois flèches (ruban de Möbius) avec « 60 % » au centre ?",a:["Le produit contient 60 % de matière recyclée", "Le produit est recyclé à 60 %", "Il reste 60 % du produit après usage", "Le produit coûte 60 % moins cher"],e:"Sans pourcentage, il indique seulement que le produit est techniquement recyclable."},
  {k:"dech",l:3,t:"vf",q:"La Belgique fait partie des pays européens qui recyclent la plus grande part de leurs emballages.",v:true,e:"Grâce au tri et au système Fost Plus, la Belgique est régulièrement en tête des classements européens."},
  {k:"dech",l:3,t:"qcm",q:"Pourquoi les incinérateurs doivent-ils traiter leurs fumées ?",a:["Pour retenir des polluants comme les poussières fines, les métaux lourds et les dioxines", "Pour récupérer de l'eau potable", "Pour refroidir la ville", "Pour produire du plastique"],e:"Des filtres et des réactifs captent ces polluants. Les résidus sont ensuite traités comme déchets dangereux."},
  {k:"plast",l:1,t:"qcm",q:"Quel animal marin confond souvent les sacs plastiques avec des méduses ?",a:["La tortue de mer", "Le dauphin", "Le requin", "Le crabe"],e:"Elle les avale, ce qui peut bloquer son estomac et la tuer."},
  {k:"plast",l:1,t:"vf",q:"En Wallonie et à Bruxelles, les sacs plastiques légers à usage unique sont interdits aux caisses des magasins.",v:true,e:"Interdits depuis décembre 2016 en Wallonie et depuis 2017 à Bruxelles. On emporte donc son propre sac."},
  {k:"plast",l:1,t:"qcm",q:"Quel objet en plastique jetable est interdit dans l'Union européenne depuis 2021 ?",a:["La paille", "La bouteille d'eau", "Le sac-poubelle", "La brosse à dents"],e:"Pailles, couverts, assiettes et cotons-tiges en plastique jetable sont interdits depuis juillet 2021."},
  {k:"plast",l:1,t:"qcm",q:"D'où vient la plus grande partie du plastique qui pollue les océans ?",a:["De la terre : déchets mal gérés emportés par le vent et les rivières", "Des poissons", "Des volcans sous-marins", "Des bateaux de croisière uniquement"],e:"Les filets de pêche perdus pèsent aussi beaucoup, surtout au large."},
  {k:"plast",l:1,t:"qcm",q:"Pour faire ses courses sans plastique jetable, on peut emporter…",a:["Un sac réutilisable et ses propres boîtes", "Plus de sacs plastiques", "Des sacs en papier qu'on jette", "Rien du tout"],e:"Le sac le plus écologique est celui qu'on réutilise le plus grand nombre de fois."},
  {k:"plast",l:2,t:"qcm",q:"Que signifie le chiffre dans le petit triangle sous un objet en plastique (par exemple « 1 ») ?",a:["Le type de plastique utilisé", "Le nombre de fois qu'il a été recyclé", "Son prix", "Son âge"],e:"De 1 à 7, ce code aide les centres de tri à reconnaître la matière."},
  {k:"plast",l:2,t:"qcm",q:"Quel plastique, utilisé pour les bouteilles d'eau, porte le code 1 ?",a:["Le PET", "Le PVC", "Le polystyrène", "Le nylon"],e:"Le PET (polyéthylène téréphtalate) se recycle bien, notamment en nouvelles bouteilles et en fibres textiles."},
  {k:"plast",l:2,t:"qcm",q:"Quel plastique très léger est appelé « frigolite » en Belgique ?",a:["Le polystyrène expansé", "Le PET", "Le PVC", "Le polyester"],e:"Il est composé à plus de 95 % d'air et se casse facilement en petites billes qui s'envolent."},
  {k:"plast",l:2,t:"qcm",q:"Pourquoi les microplastiques sont-ils dangereux pour les animaux marins ?",a:["Ils sont avalés, remplissent l'estomac et peuvent transporter des polluants", "Ils rendent l'eau trop salée", "Ils réchauffent l'eau", "Ils font disparaître l'oxygène de l'air"],e:"Les animaux peuvent se sentir rassasiés sans être nourris, et les polluants passent dans la chaîne alimentaire."},
  {k:"plast",l:2,t:"qcm",q:"Dans le monde, quel secteur utilise le plus de plastique ?",a:["Les emballages", "Les voitures", "Les jouets", "Les médicaments"],e:"Beaucoup d'emballages ne servent que quelques minutes avant de devenir des déchets."},
  {k:"plast",l:2,t:"vf",q:"Un plastique « biodégradable » se décompose rapidement dans la mer.",v:false,e:"La plupart ont besoin de la chaleur d'un compost industriel. Dans l'eau froide de la mer, ils restent longtemps."},
  {k:"plast",l:2,t:"qcm",q:"Acheter « en vrac », c'est…",a:["Acheter sans emballage, dans ses propres contenants", "Acheter en très grande quantité", "Acheter des produits abîmés", "Acheter en ligne"],e:"On ne paie que ce qu'on prend, et on évite les emballages jetables."},
  {k:"plast",l:3,t:"qcm",q:"Dans le monde, quelle part des déchets plastiques échappe à toute gestion (décharges sauvages, brûlage à l'air libre, nature) ?",a:["Environ 22 %", "Environ 2 %", "Environ 72 %", "Environ 92 %"],e:"Environ la moitié est enfouie dans des décharges contrôlées, 19 % incinérée et 9 % recyclée (données 2019)."},
  {k:"plast",l:3,t:"qcm",q:"Que sont les « larmes de sirène » trouvées sur les plages ?",a:["Des granulés de plastique industriels perdus pendant le transport", "Des gouttes d'eau salée", "Des œufs de poissons", "Des perles naturelles"],e:"Ces petites billes sont la matière première des objets en plastique. Des conteneurs entiers en ont déjà perdu en mer."},
  {k:"plast",l:3,t:"qcm",q:"Pourquoi des polluants s'accumulent-ils à la surface des microplastiques ?",a:["Des polluants peu solubles dans l'eau se fixent sur le plastique", "Le plastique produit lui-même ces polluants avec la lumière", "Les poissons les y déposent", "Ce n'est pas vrai"],e:"Des polluants organiques persistants (comme les PCB) se concentrent sur ces particules, qui sont ensuite avalées."},
  {k:"plast",l:3,t:"qcm",q:"Depuis octobre 2023, quel produit vise l'interdiction européenne des microplastiques ajoutés volontairement ?",a:["Les paillettes en plastique en vrac", "Les bouteilles d'eau", "Les sacs-poubelle", "Les pneus"],e:"D'autres produits (certains cosmétiques, terrains de sport synthétiques) suivront avec des périodes de transition."},
  {k:"plast",l:3,t:"qcm",q:"En 2022, l'Assemblée des Nations unies pour l'environnement a décidé de négocier…",a:["Un traité mondial contre la pollution plastique", "L'interdiction totale du plastique", "Une taxe sur les bouteilles de soda", "La fermeture des usines de plastique"],e:"Les négociations entre pays sont longues : elles portent sur la production, la conception et la gestion des déchets."},
  {k:"plast",l:3,t:"qcm",q:"Le recyclage « chimique » du plastique consiste à…",a:["Décomposer les polymères en petites molécules pour refaire du plastique", "Broyer le plastique en paillettes", "Brûler le plastique", "Enterrer le plastique"],e:"Il peut traiter des plastiques mélangés, mais il consomme beaucoup d'énergie."},
  {k:"plast",l:3,t:"qcm",q:"Pourquoi brûler du PVC est-il particulièrement dangereux ?",a:["Il contient du chlore et libère de l'acide chlorhydrique, voire des dioxines", "Il explose", "Il produit de l'oxygène", "Il devient radioactif"],e:"Le PVC (polychlorure de vinyle) contient environ 57 % de chlore en masse."},
  {k:"tel",l:1,t:"qcm",q:"Quelle pièce d'un téléphone perd le plus vite de son efficacité avec le temps ?",a:["La batterie", "L'écran", "Le haut-parleur", "La coque"],e:"Une batterie usée se remplace : c'est bien moins polluant que d'acheter un nouveau téléphone."},
  {k:"tel",l:1,t:"qcm",q:"Pourquoi une batterie de téléphone ne doit-elle jamais aller à la poubelle ?",a:["Elle contient du lithium et peut prendre feu si elle est écrasée", "Elle est trop lourde", "Elle attire les insectes", "Elle sent mauvais"],e:"Des incendies se déclarent dans les camions-poubelles à cause de batteries jetées. On les rapporte chez Bebat."},
  {k:"tel",l:1,t:"qcm",q:"Qu'est-ce qu'un « Repair Café » ?",a:["Un lieu où des bénévoles aident gratuitement à réparer ses objets", "Un café où on boit en réparant son vélo seul", "Un magasin de téléphones neufs", "Une application"],e:"On y répare des appareils, des vêtements, des vélos… Il en existe dans de nombreuses communes belges."},
  {k:"tel",l:1,t:"qcm",q:"Depuis fin 2024, dans l'Union européenne, quel type de prise de recharge doivent avoir les nouveaux téléphones ?",a:["USB-C", "Lightning", "Micro-USB", "Il n'y a pas de règle"],e:"Un seul chargeur pour tous : moins de câbles à fabriquer et à jeter."},
  {k:"tel",l:1,t:"qcm",q:"Le téléphone le plus écologique, c'est…",a:["Celui qu'on a déjà, gardé le plus longtemps possible", "Un téléphone neuf « écologique »", "Le téléphone le plus léger", "Le téléphone le moins cher"],e:"Fabriquer un téléphone pèse plus que l'utiliser pendant des années."},
  {k:"tel",l:1,t:"qcm",q:"Comment protéger son téléphone pour qu'il dure plus longtemps ?",a:["Avec une coque et une protection d'écran", "En le laissant au soleil", "En le chargeant toute la journée", "En ne mettant jamais à jour ses applications"],e:"Un écran cassé est l'une des pannes les plus fréquentes."},
  {k:"tel",l:2,t:"qcm",q:"Qu'appelle-t-on « minerais de conflit » ?",a:["Des minerais dont l'extraction finance des groupes armés", "Des minerais très durs à casser", "Des minerais qu'on se dispute à l'école", "Des minerais radioactifs"],e:"L'étain, le tantale, le tungstène et l'or sont concernés. Une loi européenne oblige les importateurs à vérifier leur origine."},
  {k:"tel",l:2,t:"qcm",q:"Le coltan, extrait notamment en RD Congo, fournit quel métal utilisé dans les téléphones ?",a:["Le tantale", "Le fer", "L'aluminium", "Le plomb"],e:"Le tantale sert à fabriquer de tout petits condensateurs, indispensables aux appareils électroniques."},
  {k:"tel",l:2,t:"qcm",q:"Depuis juin 2025, l'étiquette européenne des smartphones indique notamment…",a:["Une note de réparabilité de A à E", "La couleur préférée des clients", "Le nombre de photos possibles", "Le prix de revente"],e:"Elle affiche aussi l'autonomie, la durée de vie de la batterie et la résistance aux chutes, à l'eau et à la poussière."},
  {k:"tel",l:2,t:"vf",q:"Selon les règles européennes, la batterie d'un nouveau smartphone doit garder au moins 80 % de sa capacité après 800 recharges complètes.",v:true,e:"Cette règle d'écoconception s'applique depuis le 20 juin 2025."},
  {k:"tel",l:2,t:"qcm",q:"Pourquoi est-il difficile de recycler un smartphone ?",a:["Il contient beaucoup de matériaux différents, en petites quantités et collés ensemble", "Il est trop grand", "Il est fait d'un seul métal", "Les usines refusent les téléphones"],e:"On récupère surtout le cuivre, l'or, l'argent et le cobalt. Beaucoup d'autres éléments sont perdus."},
  {k:"tel",l:2,t:"qcm",q:"Qu'est-ce que l'« empreinte carbone » d'un téléphone ?",a:["Les gaz à effet de serre émis sur toute sa vie : fabrication, transport, utilisation et fin de vie", "La trace de doigts sur l'écran", "Le poids de sa batterie", "Son nombre d'applications"],e:"On parle d'analyse du cycle de vie. Pour un smartphone, la fabrication domine."},
  {k:"tel",l:3,t:"qcm",q:"Quel est l'ordre de grandeur des émissions liées à la fabrication d'un smartphone ?",a:["Plusieurs dizaines de kilos de CO₂", "Quelques grammes de CO₂", "Plusieurs tonnes de CO₂", "Moins d'un kilo de CO₂"],e:"Les fabricants publient des chiffres de l'ordre de 40 à 80 kg de CO₂ équivalent sur tout le cycle de vie, dont l'essentiel pour la fabrication."},
  {k:"tel",l:3,t:"qcm",q:"Combien de kilos de déchets électroniques un Européen produisait-il en moyenne en 2022 ?",a:["Environ 17,6 kg", "Environ 1,7 kg", "Environ 176 kg", "Environ 0,2 kg"],e:"C'est la région du monde qui en produit le plus par habitant, mais aussi celle qui en recycle le plus (environ 43 %)."},
  {k:"tel",l:3,t:"qcm",q:"Dans le « triangle du lithium » (Chili, Argentine, Bolivie), l'extraction pose surtout problème pour…",a:["L'eau, très rare dans ces régions désertiques", "Le bruit", "La lumière", "Le vent"],e:"Le lithium est extrait de saumures qu'on fait évaporer, ce qui pèse sur les ressources en eau des communautés locales."},
  {k:"tel",l:3,t:"qcm",q:"Que sont les « terres rares » ?",a:["Un groupe de 17 éléments chimiques difficiles à extraire et à séparer", "Des sols très fertiles", "Des pays où il ne pleut jamais", "Des minerais radioactifs uniquement"],e:"Les 15 lanthanides, le scandium et l'yttrium. Pas si rares, mais dispersés et difficiles à purifier. Ils servent dans les aimants des haut-parleurs et des moteurs."},
  {k:"tel",l:3,t:"qcm",q:"Quel pays raffine la très grande majorité des terres rares dans le monde ?",a:["La Chine", "La Belgique", "Le Brésil", "Le Canada"],e:"Selon l'AIE, plus de 85 % du raffinage, ce qui rend les autres pays très dépendants."},
  {k:"tel",l:3,t:"qcm",q:"En Belgique, l'usine Umicore d'Hoboken (Anvers) est connue pour…",a:["Récupérer les métaux précieux des déchets électroniques", "Fabriquer des smartphones", "Produire du plastique", "Extraire du charbon"],e:"On parle de « mine urbaine » : on y récupère notamment or, argent, cuivre et platine."},
  {k:"tel",l:3,t:"qcm",q:"La directive européenne « droit à la réparation » (2024) oblige notamment les fabricants à…",a:["Proposer la réparation de certains appareils, dont les smartphones, même après la garantie", "Remplacer gratuitement tous les téléphones chaque année", "Interdire les téléphones d'occasion", "Fermer les Repair Cafés"],e:"Le but : rendre la réparation plus facile et moins chère que le remplacement."},
  {k:"tel",l:3,t:"qcm",q:"Combien de smartphones ont été vendus dans le monde en 2024 ?",a:["Environ 1,2 milliard", "Environ 12 millions", "Environ 120 millions", "Environ 12 milliards"],e:"Plus de 3 millions de téléphones neufs par jour."},
  {k:"ia",l:1,t:"vf",q:"Envoyer une vidéo par message consomme plus d'énergie qu'envoyer un court texte.",v:true,e:"Une vidéo pèse des milliers de fois plus qu'un texte. Plus il y a de données, plus il faut d'énergie pour les transporter et les stocker."},
  {k:"ia",l:1,t:"qcm",q:"Pourquoi un ordinateur ou une console chauffe-t-il quand on l'utilise ?",a:["Une partie de l'électricité se transforme en chaleur", "Il y a un petit feu à l'intérieur", "Le soleil le chauffe", "Il est mal rangé"],e:"C'est l'effet Joule. C'est aussi pour ça que les centres de données doivent être refroidis."},
  {k:"ia",l:1,t:"qcm",q:"Quel geste fait économiser de l'énergie avec la télévision ou l'ordinateur ?",a:["L'éteindre complètement plutôt que le laisser en veille", "Le laisser allumé toute la nuit", "Augmenter la luminosité", "Ouvrir plus de fenêtres sur l'écran"],e:"Les appareils en veille consomment encore de l'électricité, jour et nuit."},
  {k:"ia",l:1,t:"vf",q:"Regarder une vidéo en Wi-Fi consomme en général moins d'énergie qu'en 4G.",v:true,e:"Le réseau mobile consomme plus d'énergie par donnée transportée. Quand c'est possible, on préfère le Wi-Fi."},
  {k:"ia",l:1,t:"qcm",q:"La lecture automatique des vidéos (autoplay)…",a:["Fait regarder plus de vidéos et consommer plus de données", "Économise la batterie", "Protège l'environnement", "Ne change rien"],e:"La désactiver dans les réglages, c'est un petit geste simple."},
  {k:"ia",l:1,t:"qcm",q:"Pourquoi certains centres de données sont-ils construits dans des pays froids comme l'Islande ou la Norvège ?",a:["Pour refroidir les serveurs plus facilement", "Parce que les ordinateurs aiment la neige", "Pour être loin des gens", "Parce que c'est moins cher de construire sur la glace"],e:"L'air froid refroidit les serveurs, et ces pays produisent beaucoup d'électricité renouvelable."},
  {k:"ia",l:1,t:"qcm",q:"Une intelligence artificielle comme un chatbot apprend à partir de…",a:["Très grandes quantités de textes et d'images", "Rien, elle sait tout dès le début", "Un seul livre", "Ses rêves"],e:"Pour apprendre, il faut d'énormes ordinateurs qui tournent pendant des semaines."},
  {k:"ia",l:2,t:"qcm",q:"Générer une image avec une IA consomme…",a:["Beaucoup plus d'énergie que générer un court texte", "Aucune énergie", "Moins d'énergie qu'envoyer un SMS", "Autant qu'allumer une ampoule une seconde"],e:"Une étude de 2023 a montré que la génération d'images est la tâche d'IA la plus gourmande en énergie parmi celles testées."},
  {k:"ia",l:2,t:"qcm",q:"Que signifie « sobriété numérique » ?",a:["Utiliser le numérique de façon modérée et réfléchie", "Ne plus jamais utiliser d'écran", "Acheter le plus d'appareils possible", "Utiliser uniquement des appareils neufs"],e:"Garder ses appareils, limiter la vidéo en haute définition, éteindre ce qui ne sert pas…"},
  {k:"ia",l:2,t:"qcm",q:"Pourquoi une vidéo en 4K consomme-t-elle plus qu'en définition standard ?",a:["Elle contient beaucoup plus de pixels, donc plus de données à transférer", "Elle est plus longue", "Elle est en couleur", "Elle a plus de son"],e:"Une image 4K contient environ 8 millions de pixels, contre environ 2 millions en Full HD."},
  {k:"ia",l:2,t:"vf",q:"Les cryptomonnaies comme le bitcoin consomment beaucoup d'électricité.",v:true,e:"Le « minage » du bitcoin consomme autant d'électricité qu'un pays entier."},
  {k:"ia",l:2,t:"qcm",q:"Dans les projets les plus vertueux, que fait-on de la chaleur produite par les serveurs ?",a:["On la récupère pour chauffer des logements ou des piscines", "On la jette dans la mer", "On l'enferme dans des boîtes", "On ne peut rien en faire"],e:"Stockholm, par exemple, branche des centres de données sur son réseau de chaleur urbain."},
  {k:"ia",l:2,t:"qcm",q:"Une box internet laissée allumée en permanence…",a:["Consomme de l'électricité même quand personne ne l'utilise", "Ne consomme rien la nuit", "Produit de l'électricité", "S'éteint toute seule"],e:"On peut l'éteindre la nuit ou pendant les vacances avec une multiprise à interrupteur."},
  {k:"ia",l:3,t:"qcm",q:"Que mesure le PUE d'un centre de données ?",a:["Le rapport entre l'énergie totale du site et celle utilisée par les serveurs", "Le nombre d'ordinateurs", "La vitesse d'internet", "Le prix de l'électricité"],e:"Un PUE de 1 serait parfait : toute l'énergie irait aux serveurs. Au-dessus, c'est le refroidissement et le reste."},
  {k:"ia",l:3,t:"qcm",q:"Qu'appelle-t-on l'« effet rebond » ?",a:["Quand un progrès d'efficacité est annulé par une hausse de l'utilisation", "Quand un ballon rebondit plus haut", "Quand un appareil se rallume tout seul", "Quand le prix de l'électricité baisse"],e:"Des appareils plus efficaces, mais beaucoup plus nombreux et plus utilisés : la consommation totale peut augmenter."},
  {k:"ia",l:3,t:"qcm",q:"Pourquoi le refroidissement des centres de données par évaporation pose-t-il problème dans les régions sèches ?",a:["Il consomme beaucoup d'eau douce, déjà rare pour les habitants et l'agriculture", "Il fait trop de bruit", "Il produit de la neige", "Il attire les moustiques"],e:"Certains projets de centres de données ont été contestés pour cette raison."},
  {k:"ia",l:3,t:"qcm",q:"Qu'est-ce qu'une « IA frugale » ?",a:["Une IA conçue pour utiliser le moins de données et d'énergie possible", "Une IA gratuite", "Une IA qui mange des fruits", "Une IA sans ordinateur"],e:"Par exemple, choisir un petit modèle quand un grand n'est pas nécessaire."},
  {k:"ia",l:3,t:"qcm",q:"Pour une entreprise du numérique, que regroupent les émissions du « scope 3 » ?",a:["Les émissions indirectes, comme la fabrication des puces et des serveurs achetés", "Uniquement le chauffage des bureaux", "Uniquement les voitures de l'entreprise", "Rien du tout"],e:"Ce sont souvent les plus importantes, et les plus difficiles à mesurer."},
  {k:"ia",l:3,t:"qcm",q:"Quel territoire fabrique la grande majorité des puces électroniques les plus avancées ?",a:["Taïwan", "La Belgique", "Le Mexique", "L'Australie"],e:"Cette concentration rend le monde entier dépendant de quelques usines. En Belgique, l'imec (Louvain) est un centre de recherche mondial sur les puces."},
  {k:"ia",l:3,t:"qcm",q:"De quoi les usines de puces électroniques ont-elles besoin en très grande quantité ?",a:["D'eau ultra-pure et d'électricité", "De sable de plage non lavé", "De charbon", "De bois"],e:"Les puces sont rincées à de nombreuses étapes avec une eau extrêmement purifiée."},
  {k:"mode",l:1,t:"qcm",q:"Que faire d'un vêtement trop petit mais en bon état ?",a:["Le donner, l'échanger ou le revendre", "Le jeter à la poubelle", "Le brûler", "Le mettre dans le sac PMC"],e:"Il pourra être porté par quelqu'un d'autre : c'est autant de vêtements neufs en moins à fabriquer."},
  {k:"mode",l:1,t:"qcm",q:"Ton pantalon préféré a un petit trou. Le geste le plus écologique ?",a:["Le réparer (couture, patch)", "En acheter un neuf", "Le jeter", "Le cacher au fond de l'armoire"],e:"Réparer prolonge la vie du vêtement. Les Repair Cafés aident aussi pour la couture."},
  {k:"mode",l:1,t:"qcm",q:"Le coton est…",a:["Une fibre naturelle qui vient d'une plante", "Un plastique", "Une fibre qui vient d'un animal", "Un minéral"],e:"Les fibres poussent autour des graines du cotonnier."},
  {k:"mode",l:1,t:"qcm",q:"D'où vient la soie ?",a:["Du cocon d'une chenille, le ver à soie", "D'une plante", "Du pétrole", "D'une araignée géante"],e:"La chenille du bombyx fabrique un fil de soie très long pour construire son cocon."},
  {k:"mode",l:1,t:"qcm",q:"Qu'est-ce qu'une friperie ?",a:["Un magasin de vêtements de seconde main", "Un magasin de frites", "Une usine de vêtements", "Un pressing"],e:"Acheter d'occasion évite la fabrication de vêtements neufs."},
  {k:"mode",l:1,t:"vf",q:"Laver ses vêtements à 30 °C plutôt qu'à 60 °C consomme moins d'énergie.",v:true,e:"La plus grande partie de l'énergie d'une machine sert à chauffer l'eau."},
  {k:"mode",l:2,t:"qcm",q:"Quel label garantit un textile en coton biologique et le respect de critères sociaux ?",a:["GOTS", "Nutri-Score", "CE", "Point vert"],e:"GOTS signifie Global Organic Textile Standard (norme mondiale du textile biologique)."},
  {k:"mode",l:2,t:"qcm",q:"Qu'est-ce que le « greenwashing » ?",a:["Faire croire qu'un produit ou une entreprise est plus écologique qu'en réalité", "Laver ses vêtements à l'eau verte", "Recycler les vêtements", "Planter des arbres"],e:"Une nouvelle directive européenne (2024) interdit les allégations écologiques vagues comme « respectueux de l'environnement » sans preuve."},
  {k:"mode",l:2,t:"qcm",q:"Pour sécher son linge, le geste le plus écologique est…",a:["Le faire sécher à l'air libre", "Utiliser le sèche-linge à chaque lavage", "Le repasser mouillé", "Le laisser dans la machine"],e:"Le sèche-linge fait partie des appareils ménagers qui consomment le plus d'électricité."},
  {k:"mode",l:2,t:"qcm",q:"Qu'appelle-t-on l'« ultra fast fashion » ?",a:["Des vêtements produits en quantités énormes, très vite, vendus en ligne à très bas prix", "Des vêtements de course à pied", "Des vêtements livrés par drone", "Des vêtements de luxe"],e:"Certaines plateformes mettent en ligne des milliers de nouveaux modèles chaque jour."},
  {k:"mode",l:2,t:"qcm",q:"Pourquoi la teinture des textiles pollue-t-elle ?",a:["Elle rejette des produits chimiques dans les rivières", "Elle consomme du sable", "Elle produit du bruit", "Elle ne pollue pas"],e:"Dans certains pays producteurs, la couleur des rivières change selon les teintures à la mode."},
  {k:"mode",l:2,t:"qcm",q:"D'où viennent la plupart des vêtements vendus en Europe ?",a:["D'Asie (Chine, Bangladesh…) et de Turquie", "De Belgique", "D'Islande", "D'Australie"],e:"Ils parcourent souvent des milliers de kilomètres avant d'arriver en magasin."},
  {k:"mode",l:3,t:"qcm",q:"Combien de kilos de textiles (vêtements, chaussures, linge de maison) un Européen consommait-il en 2022 ?",a:["Environ 19 kg", "Environ 2 kg", "Environ 90 kg", "Environ 190 kg"],e:"Un record : c'était environ 17 kg en 2019."},
  {k:"mode",l:3,t:"qcm",q:"Dans le monde, quelle part des matières des vêtements est recyclée pour faire de nouveaux vêtements ?",a:["Moins de 1 %", "Environ 25 %", "Environ 50 %", "Plus de 90 %"],e:"La plupart des textiles collectés sont transformés en chiffons ou en isolants, ou finissent en décharge et en incinération."},
  {k:"mode",l:3,t:"qcm",q:"Depuis le 1er janvier 2025, que doivent organiser tous les pays de l'Union européenne ?",a:["La collecte séparée des textiles usagés", "L'interdiction des vêtements en coton", "La fermeture des friperies", "Une taxe sur les chaussettes"],e:"En 2025, l'UE a aussi décidé que les marques devront financer la collecte et le traitement des textiles usagés."},
  {k:"mode",l:3,t:"qcm",q:"Pourquoi un vêtement en coton-polyester est-il difficile à recycler ?",a:["Les deux fibres sont mélangées et très difficiles à séparer", "Le polyester se dissout dans l'eau", "Le coton est radioactif", "Il est trop léger"],e:"Les vêtements faits d'une seule fibre se recyclent beaucoup plus facilement."},
  {k:"mode",l:3,t:"qcm",q:"La viscose est une fibre fabriquée à partir…",a:["De la cellulose du bois, transformée par des procédés chimiques", "Du pétrole", "De la laine de mouton", "Du sable"],e:"Elle est d'origine végétale, mais sa fabrication utilise des produits chimiques et peut contribuer à la déforestation."},
  {k:"mode",l:3,t:"qcm",q:"Quel métal toxique est très utilisé pour le tannage du cuir ?",a:["Le chrome", "L'or", "Le sodium", "Le magnésium"],e:"Mal maîtrisé, le chrome peut se transformer en chrome VI, toxique et cancérogène, et polluer l'eau autour des tanneries."},
  {k:"mode",l:3,t:"qcm",q:"Qu'est-ce qui distingue surtout le coton biologique du coton conventionnel ?",a:["Il est cultivé sans pesticides ni engrais chimiques de synthèse et sans OGM", "Il pousse plus vite", "Il est toujours fabriqué en Europe", "Il ne demande pas d'eau"],e:"Il demande toujours de l'eau : le bio n'efface pas tous les impacts."},
  {k:"mode",l:3,t:"qcm",q:"Quelle part des exportations du Bangladesh représentent les vêtements ?",a:["Environ 80 %", "Environ 8 %", "Environ 30 %", "Moins de 1 %"],e:"Des millions de personnes, surtout des femmes, travaillent dans ce secteur."},
  {k:"alim",l:1,t:"qcm",q:"Quel fruit est de saison en Belgique en été ?",a:["Les fraises", "Les oranges", "Les bananes", "Les ananas"],e:"Les fraises belges se récoltent surtout de mai à septembre."},
  {k:"alim",l:1,t:"qcm",q:"Quel fruit ne pousse pas en Belgique et vient toujours de loin ?",a:["La banane", "La pomme", "La poire", "La cerise"],e:"Les bananes viennent surtout d'Amérique latine, en bateau."},
  {k:"alim",l:1,t:"qcm",q:"Que peut-on faire avec du pain rassis ?",a:["Du pain perdu ou de la chapelure", "Le jeter", "Le mettre dans le sac PMC", "Rien"],e:"Cuisiner les restes est l'un des meilleurs gestes contre le gaspillage alimentaire."},
  {k:"alim",l:1,t:"qcm",q:"Les lentilles, pois chiches et haricots secs sont…",a:["Riches en protéines et peu émetteurs de gaz à effet de serre", "Des aliments sans aucune valeur", "Toujours importés en avion", "Des produits laitiers"],e:"Ce sont des légumineuses. Elles fertilisent aussi naturellement le sol en y fixant l'azote de l'air."},
  {k:"alim",l:1,t:"vf",q:"Le compost transforme les épluchures en engrais naturel pour le jardin.",v:true,e:"Des vers, des champignons et des bactéries décomposent les déchets en quelques mois."},
  {k:"alim",l:1,t:"qcm",q:"Quelle boisson a le plus petit impact sur l'environnement ?",a:["L'eau du robinet", "Le soda en canette", "L'eau en bouteille plastique", "Le jus de fruits importé"],e:"Pas d'emballage, pas de transport en camion : elle arrive directement au robinet."},
  {k:"alim",l:2,t:"qcm",q:"Que signifie acheter « en circuit court » ?",a:["Acheter avec au maximum un intermédiaire entre le producteur et soi", "Acheter très vite", "Acheter uniquement au supermarché", "Acheter sur internet"],e:"Par exemple : à la ferme, au marché ou via un groupe d'achat solidaire."},
  {k:"alim",l:2,t:"qcm",q:"Pourquoi l'huile de palme est-elle souvent critiquée ?",a:["Sa culture a causé une forte déforestation en Indonésie et en Malaisie", "Elle est trop chère", "Elle vient d'un animal", "Elle ne pousse que dans le désert"],e:"La destruction des forêts menace des espèces comme l'orang-outan."},
  {k:"alim",l:2,t:"qcm",q:"À quoi sert surtout le soja cultivé dans le monde ?",a:["À nourrir les animaux d'élevage", "À faire du tofu", "À fabriquer du papier", "À produire du plastique"],e:"Environ trois quarts du soja mondial servent à l'alimentation animale. Sa culture participe à la déforestation en Amérique du Sud."},
  {k:"alim",l:2,t:"qcm",q:"Que garantit le label bio européen (feuille formée d'étoiles) ?",a:["Pas de pesticides ni d'engrais chimiques de synthèse, ni d'OGM", "Un produit fabriqué en Belgique", "Un produit sans sucre", "Un produit forcément local"],e:"Bio ne veut pas dire local : un produit bio peut venir de loin."},
  {k:"alim",l:2,t:"qcm",q:"Que mesure le Nutri-Score (lettres de A à E) ?",a:["La qualité nutritionnelle d'un aliment", "Son impact sur le climat", "Son prix", "Sa distance de transport"],e:"Un aliment noté A peut quand même avoir un fort impact environnemental."},
  {k:"alim",l:2,t:"qcm",q:"Parmi ces aliments, lequel émet le moins de gaz à effet de serre par kilo ?",a:["La volaille", "Le bœuf", "L'agneau", "Le fromage"],e:"La volaille émet plusieurs fois moins que le bœuf, et les légumineuses encore beaucoup moins."},
  {k:"alim",l:2,t:"qcm",q:"Que garantit le label MSC (poisson bleu) ?",a:["Un poisson issu d'une pêche durable", "Un poisson élevé en Belgique", "Un poisson sans arêtes", "Un poisson bio"],e:"MSC signifie Marine Stewardship Council : la pêche doit préserver les stocks de poissons et le milieu marin."},
  {k:"alim",l:3,t:"qcm",q:"Quel gaz à effet de serre puissant est libéré par les engrais azotés ?",a:["Le protoxyde d'azote (N₂O)", "Le dioxygène", "L'hélium", "Le dihydrogène"],e:"Il réchauffe environ 270 fois plus que le CO₂ sur 100 ans et abîme aussi la couche d'ozone."},
  {k:"alim",l:3,t:"qcm",q:"Selon la FAO, l'élevage représente environ quelle part des émissions mondiales de gaz à effet de serre d'origine humaine ?",a:["Environ 12 %", "Environ 1 %", "Environ 50 %", "Environ 80 %"],e:"Les bovins représentent plus de 60 % de ces émissions."},
  {k:"alim",l:3,t:"qcm",q:"Quelle part des terres agricoles du monde sert à l'élevage (pâturages et cultures pour nourrir les animaux) ?",a:["Plus des trois quarts", "Environ 10 %", "Environ un tiers", "La moitié exactement"],e:"Pourtant, la viande et les produits laitiers n'apportent qu'environ 18 % des calories consommées dans le monde."},
  {k:"alim",l:3,t:"qcm",q:"Pourquoi les rizières émettent-elles du méthane ?",a:["Dans les champs inondés, la matière organique se décompose sans oxygène", "Le riz respire du méthane", "Les agriculteurs y versent du gaz", "Le soleil chauffe l'eau"],e:"Des bactéries qui vivent sans oxygène produisent ce méthane. Assécher les rizières par moments réduit les émissions."},
  {k:"alim",l:3,t:"qcm",q:"D'après le Water Footprint Network, combien d'eau faut-il en moyenne pour produire 1 kg de bœuf ?",a:["Environ 15 000 litres", "Environ 15 litres", "Environ 150 litres", "Environ 1,5 million de litres"],e:"On parle d'« eau virtuelle ». Elle sert surtout à faire pousser la nourriture des animaux, et c'est en grande partie de l'eau de pluie."},
  {k:"alim",l:3,t:"qcm",q:"Pourquoi l'acidification des océans menace-t-elle les huîtres et les moules ?",a:["Le CO₂ dissous rend l'eau plus acide, ce qui gêne la fabrication de leur coquille calcaire", "L'eau devient trop salée", "L'eau devient trop froide", "Les poissons les mangent plus"],e:"Le CO₂ forme de l'acide carbonique dans l'eau. Les océans absorbent environ un quart du CO₂ que nous émettons."},
  {k:"alim",l:3,t:"qcm",q:"Qu'est-ce que l'agroforesterie ?",a:["Planter des arbres au milieu des cultures ou des prairies", "Cultiver des légumes en forêt profonde", "Abattre des arbres pour cultiver", "Faire pousser des arbres en serre"],e:"Les arbres stockent du carbone, protègent les sols et abritent la biodiversité."},
  {k:"alim",l:3,t:"qcm",q:"Quelle part des émissions mondiales de gaz à effet de serre vient du système alimentaire (agriculture, déforestation, transport, emballage…) ?",a:["Environ un tiers", "Environ 3 %", "Environ 75 %", "Environ 99 %"],e:"Une étude de 2021 l'estime à 34 %. L'agriculture et le changement d'usage des terres en représentent la plus grande partie."},

function startHost() {
  if (typeof Peer === "undefined" || typeof RTCPeerConnection === "undefined") { net = "off"; return render(); }
  let p;
  try { p = new Peer(PEER_PREFIX + G.room.toLowerCase(), { debug: 0, ...(window.ECO_PEER_OPTS || {}) }); } catch { net = "off"; return render(); }
  peer = p;
  const failTimer = setTimeout(() => { if (net !== "on") { net = "off"; render(); } }, 12000);
  p.on("open", () => { clearTimeout(failTimer); net = "on"; render(); });
  p.on("connection", conn => {
    conn.on("open", () => { conns.set(conn.peer, { conn, team: null }); sfx.tap(); render(); });
    conn.on("data", d => onPhone(conn.peer, d));
    conn.on("close", () => { conns.delete(conn.peer); render(); });
    conn.on("error", () => {});
  });
  p.on("disconnected", () => { setTimeout(() => { try { if (!p.destroyed && p.disconnected) p.reconnect(); } catch {} }, 1500); });
  p.on("error", e => {
    if (e.type === "unavailable-id") { clearTimeout(failTimer); p.destroy(); G.room = newRoom(); saveSetup(); startHost(); render(); }
    else if (["browser-incompatible", "network", "server-error", "socket-error", "ssl-unavailable"].includes(e.type) && net !== "on") { clearTimeout(failTimer); net = "off"; render(); }

  if (d.t === "join" && Number.isInteger(d.team) && d.team >= 0 && d.team < G.nTeams) { if (c.team !== d.team) sfx.join(); c.team = d.team; render(); }

  else if (d.t === "ans" && G.phase === "question" && c.team != null && Number.isInteger(d.i) && d.qid === G.cur.qid) setAnswer(c.team, d.i, false);

function viewFor(team) {
  const v = { ver: APP_VERSION, phase: G.phase, round: G.round, rounds: G.rounds, room: G.room,
    teams: (G.phase === "lobby" ? G.names.slice(0, G.nTeams) : G.teams.map(t => t.name)).map((n, i) => ({ name: n, color: TEAM_PRESETS[i].color, phone: teamHasPhone(i) })) };
  if (G.phase === "lobby" && G.intro != null) v.intro = G.intro;
  if (team == null || team >= G.nTeams) return v;
  v.team = team;
  if (G.phase !== "lobby") {
    const t = G.teams[team];
    const ranked = G.teams.map((x, i) => ({ s: x.score, i })).sort((a, b) => b.s - a.s);
    v.me = { score: t.score, rank: ranked.findIndex(r => r.i === team) + 1 };

  if (G.phase === "question" || G.phase === "reveal") {

  if (!pool.length) {

  const src = exact.length && Math.random() < 0.7 ? exact : pool;
  const q = src[Math.floor(Math.random() * src.length)];
  G.used.push(q.q);
  seen.push(q.q);
  store.set(seenKey(), seen);
  return q;
}
function chooseDistrict(k) {
  if (G.phase !== "choose") return;
  initAudio(); sfx.question(); setMood("tense");
  const q = pickQuestion(k);
  let opts, correct;
  if (q.t === "vf") { opts = ["Vrai", "Faux"]; correct = q.v ? 0 : 1; }
  else { const order = shuffle(q.a.map((_, i) => i)); opts = order.map(i => q.a[i]); correct = order.indexOf(0); }
  G.cur = { k, qid: Math.random().toString(36).slice(2, 8), text: q.q, opts, correct, e: q.e, type: q.t, start: Date.now(), endsAt: Date.now() + G.timer * 1000 };
  G.teams.forEach(t => { t.ans = null; t.at = 0; t.ok = null; t.gain = 0; });
  G.phase = "question"; lastSec = null;
  clearInterval(tickHandle);
  tickHandle = setInterval(tick, 200);
  render();
}
const RING_C = 2 * Math.PI * 36;
function tick() {
  if (G.phase !== "question") { clearInterval(tickHandle); return; }
  const left = G.cur.endsAt - Date.now(), sec = Math.max(0, Math.ceil(left / 1000));
  const tv = $("#tleft"), rc = $("#ringc"), rg = $("#ring");
  if (tv) tv.textContent = sec;
  if (rc) rc.style.strokeDashoffset = RING_C * (1 - Math.max(0, left) / (G.timer * 1000));
  if (rg) rg.classList.toggle("hurry", sec <= 5);
  if (sec !== lastSec) { if (sec <= 5 && sec > 0) sfx.tick(); lastSec = sec; }
  if (left <= 0) reveal();
}
function setAnswer(team, i, manual) {
  if (G.phase !== "question" || i < 0 || i >= G.cur.opts.length) return;
  const t = G.teams[team];
  if (t.ans != null && !manual) return;
  t.ans = i; t.at = Date.now(); sfx.tap();
  if (G.teams.every(x => x.ans != null)) { setTimeout(() => { if (G.phase === "question") reveal(); }, 700); }
  render();
}
function reveal() {
  if (G.phase !== "question") return;
  clearInterval(tickHandle);
  const c = G.cur, d = G.districts.find(x => x.k === c.k);
  const per = 960 / (G.nTeams * G.rounds); // calibré : ~50 % de bonnes réponses bien réparties suffisent
  let nOk = 0;
  G.teams.forEach((t, i) => {
    if (t.ans == null) { t.ok = null; t.gain = 0; return; }
    t.ok = t.ans === c.correct;
    if (t.ok) {
      nOk++;
      const speed = Math.max(0, Math.min(1, (c.endsAt - t.at) / (G.timer * 1000)));
      t.gain = (100 + Math.round(50 * speed)) * (i === G.chooser ? 2 : 1);
      t.score += t.gain;
    } else t.gain = 0;
  });
  const before = d.h;
  d.h = Math.min(100, d.h + nOk * per);
  G.lastDelta = { k: c.k, d: Math.round(d.h - before), nOk };
  G.phase = "reveal"; setMood("calm");
  nOk > 0 ? sfx.good() : sfx.bad();
  render();
}
function afterReveal() {
  if (G.phase !== "reveal") return;
  if (G.round >= G.rounds) { G.phase = "end"; render(); return endFx(); }
  if (G.round % 4 === 0) {
    const ev = G.eventDeck.shift() || shuffle(EVENTS)[0];
    if (!G.eventDeck.length) G.eventDeck = shuffle(EVENTS);
    [ev.k, ev.k2].filter(Boolean).forEach(k => { const d = G.districts.find(x => x.k === k); d.h = Math.max(0, Math.min(100, d.h + ev.d)); });
    G.event = ev; G.phase = "event"; G.lastDelta = null;
    ev.good ? sfx.goodNews() : sfx.badNews();
    return render();
  }
  nextRound();
}
function endFx() {
  const won = G.districts.every(d => d.h >= GOAL);
  if (won) sfx.win(); else sfx.badNews();
  if (!won || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors = ["#ef4b4b", "#2f78e0", "#f5b51b", "#2fae62", "#ec5f9e", "#8a55c9"];
  $("#confetti").innerHTML = Array.from({ length: 80 }, () => `<i style="left:${Math.random() * 100}%;background:${colors[Math.floor(Math.random() * 6)]};animation-duration:${2.5 + Math.random() * 3}s;animation-delay:${Math.random() * 1.5}s"></i>`).join("");
}

function planetHealth() { return G.districts.reduce((s, d) => s + d.h, 0) / G.districts.length; }

function topbar() {

function tile(d, clickable) {

  const tag = clickable ? "button" : "div";
  return `<${tag} class="tile ${chosen}" ${clickable ? `data-k="${d.k}"` : ""} style="--h:${(d.h / 100).toFixed(3)};--b:${d.h >= GOAL ? 1 : 0}" aria-label="${esc(d.name)}, ${esc(d.theme)}, santé ${h} %">

}

function teamsPanel() {
  const ranked = G.teams.map((t, i) => ({ t, i })).sort((a, b) => b.t.score - a.t.score);

    if (G.phase === "reveal") state = t.ok == null ? `<span class="pill">PAS DE RÉPONSE</span>` : t.ok ? `<span class="pill ok">+${t.gain}</span>` : `<span class="pill ko">RATÉ</span>`;
    // le choix d'une équipe n'est jamais affiché au tableau pendant la question (seulement « a répondu »)

    const isCh = i === G.chooser && G.phase !== "end";
    return `<div class="team ${isCh ? "chooser" : ""}">${isCh ? `<span class="crown">CHOISIT · ×2</span>` : ""}
