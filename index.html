}

function questionCard() {
  const c = G.cur, d = G.districts.find(x => x.k === c.k), rev = G.phase === "reveal";
  const left = Math.max(0, Math.ceil((c.endsAt - Date.now()) / 1000));
  const typeLbl = c.type === "tri" ? "TRI DES DÉCHETS" : c.type === "vf" ? "VRAI OU FAUX ?" : "QUESTION";
  const n = rev ? G.lastDelta.nOk : 0;
  const ring = `<div class="ring" id="ring"><svg viewBox="0 0 86 86"><circle cx="43" cy="43" r="36" fill="#fff" stroke="${I}" stroke-width="4"/><circle id="ringc" cx="43" cy="43" r="36" fill="none" stroke="${d.color}" stroke-width="9" stroke-dasharray="${RING_C}" stroke-dashoffset="${RING_C * (1 - left / G.timer)}"/><circle cx="43" cy="43" r="41" fill="none" stroke="${I}" stroke-width="3"/></svg><span id="tleft">${left}</span></div>`;
  return `<div class="qwrap">${tile(d, false)}
    <div class="panel qcard" style="--dom:${d.color}">
      <div class="qtop"><div style="display:flex;flex-direction:column;gap:10px;min-width:0"><span><span class="qkind">${typeLbl}</span></span><p class="qtext">${esc(c.text)}</p></div>${rev ? "" : ring}</div>
      <div class="opts">${c.opts.map((o, k) => `<div class="opt k${k + 1} ${rev ? (k === c.correct ? "right" : "dim") : ""}"><span class="k">${LETTERS[k]}</span><span>${esc(o)}</span></div>`).join("")}</div>
      ${rev ? `<div class="revealrow"><div class="burst">${BURST(n ? "#ffd23f" : "#ff8a70")}<span><b>${n}/${G.nTeams}</b>${n > 1 ? "ÉQUIPES" : "ÉQUIPE"}<br>${n ? "BRAVO !" : "AÏE !"}</span></div><div class="expl">${esc(c.e)}</div></div>
        <div class="row" style="justify-content:flex-end"><button class="btn big" id="next">${G.round >= G.rounds ? "RÉSULTAT FINAL" : "MANCHE SUIVANTE"} ➜</button></div>`
        : `<div class="row" style="justify-content:flex-end"><button class="btn white small" id="revealnow">Corriger maintenant</button></div>`}
    </div></div>`;
}

function renderGame() {
  let stage = "";
  const chooser = G.teams[G.chooser];
  if (G.phase === "choose") {
    stage = `<div class="talk">${MASCOT.replace('class="mascot"', 'class="mascot sm"')}<div class="bubble prompt">${avatar(chooser.name, chooser.color).replace('class="avatar"', 'class="avatar" style="display:inline-grid;vertical-align:middle;margin-right:6px;background:' + chooser.color + '"')}<b>${esc(chooser.name)}</b>, quel quartier voulez-vous sauver ?
      <div class="hint" style="margin-top:4px">${teamHasPhone(G.chooser) ? "Choisissez sur votre téléphone (ou cliquez ici)." : "Cliquez sur le quartier annoncé."} Votre bonne réponse comptera double !</div></div></div>
      <div class="city">${G.districts.map(d => tile(d, true)).join("")}</div>`;
  } else if (G.phase === "question") {
    stage = questionCard();
  } else if (G.phase === "reveal") {
    stage = questionCard() + `<div class="city">${G.districts.map(d => tile(d, false)).join("")}</div>`;
  } else if (G.phase === "event") {
    const ev = G.event, names = [ev.k, ev.k2].filter(Boolean).map(k => DMAP[k].name).join(" et ");
    stage = `<div class="panel news ${ev.good ? "good" : ""}">
      <span class="flash">${ev.good ? "BONNE NOUVELLE" : "FLASH INFO"}</span><h2>${esc(ev.title.toUpperCase())}</h2><p>${esc(ev.text)}</p>
      <p class="effect">${esc(names)} : ${ev.d > 0 ? "+" : ""}${ev.d} %</p>
      <div class="row" style="justify-content:flex-end"><button class="btn big" id="evnext">CONTINUER ➜</button></div></div>
      <div class="city">${G.districts.map(d => tile(d, false)).join("")}</div>`;
  } else if (G.phase === "end") {
    const won = G.districts.every(d => d.h >= GOAL);
    const ranked = G.teams.map((t, i) => ({ t, i })).sort((a, b) => b.t.score - a.t.score);
    stage = `<div class="panel end" style="display:flex;flex-direction:column;gap:14px">
      <div class="talk">${MASCOT}<div class="bubble">${won ? "Merci ! Grâce à vous, Écoville respire à nouveau !" : `${G.districts.filter(d => d.h >= GOAL).length} quartier(s) sur 6 restauré(s). Encore un effort la prochaine fois !`}</div></div>
      <h2 style="color:${won ? "#7bd389" : "#ff8a70"}">${won ? "ÉCOVILLE EST SAUVÉE !" : "PRESQUE !"}</h2>
      <div class="podium">${ranked.map((r, n) => `<div class="team">${n === 0 ? `<span class="crown">CHAMPIONS</span>` : ""}${avatar(r.t.name, r.t.color)}<span class="nm">${n + 1}. ${esc(r.t.name)}</span><span class="sc">${r.t.score}</span><div class="sub">points</div></div>`).join("")}</div>
      <div class="row" style="justify-content:space-between"><div class="row"><button class="btn green big" id="again">REJOUER</button><button class="btn white" id="tolobby">Accueil</button></div>${CREDIT}</div></div>
      <div class="city">${G.districts.map(d => tile(d, false)).join("")}</div>`;
  }
  return `${topbar()}<section class="game"><div class="stage">${stage}</div>${teamsPanel()}</section>`;
}

let confirmQuit = false;
function renderIntroHost() {
  const i = G.intro, last = i === INTRO.length - 1;
  return `<div class="introwrap" id="intro" data-i="${i}">
    <div class="introhead"><span class="logo">ÉCO<span class="v">VILLE</span></span>

    </div></div>`;
}
function setIntro(i) { initAudio(); startMusic(); G.intro = i; sfx.page(); render(); }
document.addEventListener("keydown", e => {
  if (MODE !== "host" || G.phase !== "lobby" || G.intro == null) return;
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); setIntro(G.intro < INTRO.length - 1 ? G.intro + 1 : null); }
  else if (e.key === "ArrowLeft" && G.intro > 0) setIntro(G.intro - 1);
  else if (e.key === "Escape") setIntro(null);
});

function render() {
  if (MODE !== "host") return;
  const app = $("#app");
  if (G.phase === "lobby" && G.intro != null) {
    const cur = $("#intro");
    if (!cur || +cur.dataset.i !== G.intro) {
      app.innerHTML = renderIntroHost();
      mountIntro(G.intro);
      $("#sound")?.addEventListener("click", () => { soundOn = !soundOn; store.set("ecoville-sound", soundOn); initAudio(); app.innerHTML = ""; render(); });
      $("#iskip").addEventListener("click", () => setIntro(null));
      $("#iprev").addEventListener("click", () => setIntro(Math.max(0, G.intro - 1)));
      $("#inext").addEventListener("click", () => setIntro(G.intro < INTRO.length - 1 ? G.intro + 1 : null));
    }
    return broadcast();
  }
  const focused = document.activeElement && document.activeElement.id;
  app.innerHTML = G.phase === "lobby" ? renderLobby() : renderGame();
  if (focused && focused.startsWith("tn") && $("#" + focused)) { const el = $("#" + focused); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  $("#sound")?.addEventListener("click", () => { soundOn = !soundOn; store.set("ecoville-sound", soundOn); initAudio(); startMusic(); if (soundOn) sfx.pick(); render(); });
  $("#music")?.addEventListener("click", () => { musicOn = !musicOn; store.set("ecoville-music", musicOn); initAudio(); startMusic(); render(); });
  if (G.phase === "lobby") {
    const qrEl = $("#qr");
    if (qrEl && typeof qrcode !== "undefined") { const qr = qrcode(0, "M"); qr.addData(phoneUrl()); qr.make(); qrEl.innerHTML = qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); }
    ["year", "nteams", "rounds", "timer"].forEach(id => $("#" + id).addEventListener("change", e => {
      const v = +e.target.value; ({ year: () => G.year = v, nteams: () => G.nTeams = v, rounds: () => G.rounds = v, timer: () => G.timer = v })[id]();
      saveSetup(); render();
    }));
    app.querySelectorAll("[id^=tn]").forEach(el => el.addEventListener("input", e => { G.names[+e.target.dataset.i] = e.target.value; saveSetup(); }));
    app.querySelectorAll("[id^=tn]").forEach(el => el.addEventListener("change", () => render()));
    $("#start").addEventListener("click", startGame);
    $("#story").addEventListener("click", () => setIntro(0));
  } else {
    app.querySelectorAll("button.tile[data-k]").forEach(b => b.addEventListener("click", () => chooseDistrict(b.dataset.k)));
    app.querySelectorAll(".manual button").forEach(b => b.addEventListener("click", () => setAnswer(+b.dataset.team, +b.dataset.a, true)));
    $("#next")?.addEventListener("click", afterReveal);
    $("#evnext")?.addEventListener("click", nextRound);
    $("#revealnow")?.addEventListener("click", reveal);
    $("#again")?.addEventListener("click", startGame);
    $("#tolobby")?.addEventListener("click", () => { G.phase = "lobby"; G.districts = DISTRICTS.map(d => ({ ...d, h: START_HEALTH })); $("#confetti").innerHTML = ""; render(); });
    const quit = $("#quit");
    if (quit) {
      if (confirmQuit) { quit.textContent = "Confirmer l'arrêt ?"; quit.style.background = "#ff8a70"; }
      quit.addEventListener("click", () => {
        if (!confirmQuit) { confirmQuit = true; render(); setTimeout(() => { confirmQuit = false; if (G.phase !== "lobby") render(); }, 4000); return; }
        confirmQuit = false; clearInterval(tickHandle); G.phase = "lobby"; G.districts = DISTRICTS.map(d => ({ ...d, h: START_HEALTH })); render();
      });
    }
  }
  broadcast();
}

//  MODE TÉLÉPHONE (manette d'équipe)
// =====================================================================
const P = { room: null, team: null, view: null, conn: null, peer: null, status: "connexion", answered: null, localLeft: 0, timer: null, li: 0, introDone: false, shown: null, fails: 0, err: "", openTimer: null };

function startPhone(room) {
  P.room = room.toUpperCase();
  const mem = store.get("ecoville-phone");
  if (mem && mem.room === P.room) { P.team = mem.team; P.introDone = true; }
  renderPhone();
  if (typeof Peer === "undefined" || typeof RTCPeerConnection === "undefined") { P.status = "indisponible"; return renderPhone(); }
  createPhonePeer();
  // retour sur l'onglet (écran verrouillé, appli changée) : on vérifie la connexion
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !(P.conn && P.conn.open)) retryPhone("retour"); });
}
function createPhonePeer() {
  try { P.peer && P.peer.destroy(); } catch {}
  let peerObj;
  try { peerObj = new Peer({ debug: 0, ...(window.ECO_PEER_OPTS || {}) }); } catch (e) { P.err = "peer"; return failPhone(); }
  P.peer = peerObj;
  peerObj.on("open", () => { if (P.peer === peerObj) connectPhone(); });
  peerObj.on("error", e => {
    if (P.peer !== peerObj) return;
    P.err = e.type || "erreur";
    if (e.type === "peer-unavailable") { P.status = "salle introuvable"; P.fails++; renderPhone(); clearTimeout(P.openTimer); setTimeout(connectPhone, 3000); }
    else failPhone();
  });
  peerObj.on("disconnected", () => { if (P.peer === peerObj && !(P.conn && P.conn.open)) failPhone(); });
}
function failPhone() {
  P.fails++; P.status = "nouvel essai"; renderPhone();
  clearTimeout(P.openTimer);
  setTimeout(createPhonePeer, Math.min(8000, 1500 * P.fails));
}
function retryPhone(why) { P.err = why || ""; P.fails = 0; createPhonePeer(); }
function connectPhone() {
  if (P.conn && P.conn.open) return;
  if (!P.peer || P.peer.destroyed || P.peer.disconnected) return failPhone();
  P.status = "connexion"; renderPhone();
  try { P.conn && P.conn.close(); } catch {}
  const conn = P.peer.connect(PEER_PREFIX + P.room.toLowerCase(), { reliable: true });
  P.conn = conn;
  clearTimeout(P.openTimer);
  P.openTimer = setTimeout(() => { if (P.conn === conn && !conn.open) { P.err = "délai dépassé"; try { conn.close(); } catch {} failPhone(); } }, 10000);
  conn.on("open", () => { if (P.conn !== conn) return; clearTimeout(P.openTimer); P.fails = 0; P.err = ""; P.status = "connecté"; if (P.team != null) conn.send({ t: "join", team: P.team }); conn.send({ t: "hello" }); renderPhone(); });
  conn.on("data", v => { if (P.conn === conn) onView(v); });
  conn.on("close", () => { if (P.conn !== conn) return; P.status = "reconnexion"; renderPhone(); setTimeout(connectPhone, 2000); });
  conn.on("error", () => {});
}
function send(msg) { if (P.conn && P.conn.open) try { P.conn.send(msg); } catch {} }
function onView(v) {
  if (!v || typeof v !== "object") return;
  const prev = P.view;
  P.view = v;
  if (P.team != null && v.team == null) send({ t: "join", team: P.team });
  if (v.q && (!prev || !prev.q || prev.q.qid !== v.q.qid)) { P.answered = v.q.mine; startLocalTimer(v.q.left); sfx.question(); try { navigator.vibrate?.(120); } catch {} }
  if (v.phase === "reveal" && prev && prev.phase !== "reveal") { v.res && v.res.ok ? sfx.good() : sfx.bad(); try { navigator.vibrate?.(v.res && v.res.ok ? [60, 40, 60, 40, 120] : [300, 80, 300]); } catch {} }
  if (prev && prev.phase !== v.phase && v.phase === "choose") sfx.page();
  if (prev && prev.phase !== v.phase && v.phase === "event") v.event && v.event.good ? sfx.goodNews() : sfx.badNews();
  if (prev && prev.phase !== v.phase && v.phase === "end") v.won ? sfx.win() : sfx.badNews();
  if (prev && prev.intro !== v.intro && v.intro != null) sfx.page();
  renderPhone();
}
function startLocalTimer(s) {
  clearInterval(P.timer); P.localLeft = s;
  P.timer = setInterval(() => { P.localLeft = Math.max(0, P.localLeft - 1); const el = $("#phleft"); if (el) el.textContent = P.localLeft; if (P.localLeft > 0 && P.localLeft <= 5 && P.answered == null) sfx.tick(); if (!P.localLeft) clearInterval(P.timer); }, 1000);
}

function renderPhone() {
  const app = $("#app"), v = P.view;
  // histoire : pilotée par le tableau, ou lue seul avant de choisir son équipe
  const hostIntro = v && v.phase === "lobby" && v.intro != null ? v.intro : null;
  const localIntro = v && hostIntro == null && P.team == null && !P.introDone && v.phase === "lobby" ? P.li : null;
  const introIdx = hostIntro ?? localIntro;
  if (introIdx != null) {
    const key = (hostIntro != null ? "h" : "l") + introIdx;
    if (P.shown === key) return;
    P.shown = key;
    const last = introIdx === INTRO.length - 1;
    app.innerHTML = `<div class="phone introwrap">
      <div class="ph-head"><span class="logo">ÉCO<span class="v">VILLE</span></span><span class="ver">version ${APP_VERSION}</span></div>
      ${introSlide(introIdx)}
      ${hostIntro != null ? `<div class="intronav" style="justify-content:center">${dots(introIdx)}</div><p class="ph-sub">Regardez le tableau, l'histoire continue…</p>`
        : `<div class="intronav">${dots(introIdx)}<div class="row"><button class="btn white small" id="lskip">Passer</button><button class="btn ${last ? "green" : ""}" id="lnext">${last ? "CHOISIR MON ÉQUIPE" : "SUITE ▶"}</button></div></div>`}
    </div>`;
    mountIntro(introIdx);
    $("#lnext")?.addEventListener("click", () => { initAudio(); sfx.page(); if (last) P.introDone = true; else P.li++; renderPhone(); });
    $("#lskip")?.addEventListener("click", () => { initAudio(); sfx.page(); P.introDone = true; renderPhone(); });
    return;
  }
  P.shown = null;
  const connCls = P.status === "connecté" ? "" : "off";
  const mascotSm = MASCOT.replace('class="mascot"', 'class="mascot sm"');
  let body = "";
  if (!v) {
    const msg = P.status === "indisponible" ? "Ce navigateur ne permet pas de jouer. Ouvre le lien dans Chrome ou Safari." : P.status === "salle introuvable" ? `Je ne trouve pas la salle ${esc(P.room)}. Vérifie que le tableau affiche bien ce code. Nouvel essai…` : P.fails ? `Connexion difficile, nouvel essai (${P.fails})…` : "Connexion à la salle…";
    body = `<div class="talk">${mascotSm}<div class="bubble">${msg}</div></div>
      ${P.fails >= 2 || P.status === "indisponible" ? `<div class="ph-help">Ça bloque ? Essaie dans l'ordre :
        <span>1. Ouvre le lien dans Chrome ou Safari (pas dans l'appli de l'appareil photo ou de scan).</span>
        <span>2. Passe du wifi à la 4G, ou l'inverse.</span>
        <span>3. Vérifie que le tableau affiche toujours le QR code.</span>
        <button class="btn small" id="retry">Réessayer</button>
        <small>Détail technique : ${esc(P.err || P.status)}</small></div>` : ""}`;
  } else if (P.team == null) {
    body = `<div class="talk">${mascotSm}<div class="bubble">Salut ! Quelle est ton équipe ?</div></div>
      <button class="btn white small" id="replay">▶ Revoir l'histoire</button>
      <div class="ph-pick">${v.teams.map((t, i) => `<button data-team="${i}" style="background:${t.color}"><span class="nmx">${esc(t.name)}<small>${t.phone ? "déjà un téléphone" : "libre"}</small></span></button>`).join("")}</div>`;
  } else if (v.team == null && v.phase !== "lobby") {
    body = `<div class="talk">${mascotSm}<div class="bubble">Je retrouve ton équipe…</div></div>`;
  } else {
    const t = v.teams[P.team] || { name: "?", color: "#777" };
    const head = `<div class="ph-team" style="background:${t.color}">${avatar(t.name, t.color)}<span>${esc(t.name)}</span><span class="sc">${v.me ? v.me.score + " PTS · " + v.me.rank + "E" : ""}</span></div>`;
    if (v.phase === "lobby") body = head + `<div class="talk">${mascotSm}<div class="bubble">C'est prêt ! Regardez le tableau, la partie va commencer.</div></div><button class="btn white small" id="change">Changer d'équipe</button>`;
    else if (v.phase === "choose" && v.isChooser) body = head + `<div class="ph-big">À vous de choisir le quartier !</div><p class="ph-sub">Votre bonne réponse comptera double.</p>
      <div class="ph-pick">${v.districts.map(d => `<button data-k="${d.k}" style="background:${DMAP[d.k].color}"><div class="scene" style="--h:${d.h / 100};--b:${d.h >= GOAL ? 1 : 0}">${SCENES[d.k]}</div><span class="nmx">${esc(d.name)}<small>${esc(d.theme)} · ${d.h} %</small></span></button>`).join("")}</div>`;
    else if (v.phase === "choose") body = head + `<div class="talk">${mascotSm}<div class="bubble">${esc(v.chooserName)} choisit un quartier… Préparez-vous !</div></div>`;
    else if (v.phase === "question") {
      const done = P.answered != null;
      body = head + `<div class="row" style="justify-content:space-between"><span class="label">${esc(v.q.district.toUpperCase())}</span><span class="ph-timer" id="phleft">${P.localLeft}</span></div>
        <div class="ph-q">${esc(v.q.text)}</div>
        <div class="ph-ans">${v.q.opts.map((o, k) => `<button class="k${k + 1} ${P.answered === k ? "sel" : ""}" data-a="${k}" ${done ? "disabled" : ""}><span class="k">${LETTERS[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
        ${done ? `<p class="ph-sub">Réponse envoyée ! Regardez le tableau.</p>` : ""}`;
    } else if (v.phase === "reveal") {
      const r = v.res;
      body = head + `<div class="ph-res ${r.ok == null ? "none" : r.ok ? "ok" : "ko"}"><div class="big">${r.ok == null ? "TROP TARD !" : r.ok ? "BRAVO ! +" + r.gain : "RATÉ…"}</div>
        <p style="margin:10px 0 0;font-weight:800">Bonne réponse : ${esc(r.correct)}</p></div><p class="ph-sub">${esc(r.expl)}</p>`;
    } else if (v.phase === "event") body = head + `<div class="panel news ${v.event.good ? "good" : ""}"><span class="flash">${v.event.good ? "BONNE NOUVELLE" : "FLASH INFO"}</span><h2 style="font-size:2rem">${esc(v.event.title.toUpperCase())}</h2><p style="font-size:1rem">${esc(v.event.text)}</p></div>`;
    else if (v.phase === "end") body = head + `<div class="talk">${mascotSm}<div class="bubble">${v.won ? "Écoville est sauvée, bravo !" : "Fin de la quête !"} Votre équipe termine ${v.me.rank}e avec ${v.me.score} points.</div></div>`;
  }
  app.innerHTML = `<div class="phone">
    <div class="ph-head"><span class="logo">ÉCO<span class="v">VILLE</span></span><div class="row" style="gap:8px;flex-wrap:nowrap"><span class="ph-conn ${connCls}">${esc(P.status.toUpperCase())}</span><button class="iconbtn" id="phsound" style="width:40px;height:40px" aria-label="${soundOn ? "Couper le son" : "Activer le son"}">${soundOn ? SOUND_ON : SOUND_OFF}</button></div></div>
    <div class="slidein" style="display:flex;flex-direction:column;gap:14px">${body}</div>
    <div style="display:flex;justify-content:center;margin-top:10px">${CREDIT}</div>
    <p class="ver" style="text-align:center;margin:8px 0 0">version ${APP_VERSION}${v && v.ver && v.ver !== APP_VERSION ? " · le tableau a la version " + esc(v.ver) + " : rechargez la page" : ""}</p></div>`;
  app.querySelectorAll(".ph-pick button[data-team]").forEach(b => b.addEventListener("click", () => {
    initAudio(); sfx.join(); P.team = +b.dataset.team; store.set("ecoville-phone", { room: P.room, team: P.team }); send({ t: "join", team: P.team }); renderPhone();
  }));
  app.querySelectorAll(".ph-pick button[data-k]").forEach(b => b.addEventListener("click", () => { initAudio(); sfx.tap(); send({ t: "pick", k: b.dataset.k }); }));
  app.querySelectorAll(".ph-ans button").forEach(b => b.addEventListener("click", () => {
    if (P.answered != null) return; initAudio(); sfx.tap(); P.answered = +b.dataset.a; send({ t: "ans", i: P.answered, qid: P.view.q.qid }); renderPhone();
  }));
  $("#change")?.addEventListener("click", () => { P.team = null; store.set("ecoville-phone", null); renderPhone(); });
  $("#replay")?.addEventListener("click", () => { initAudio(); sfx.page(); P.introDone = false; P.li = 0; renderPhone(); });
  $("#retry")?.addEventListener("click", () => { initAudio(); sfx.tap(); retryPhone("manuel"); });
  $("#phsound")?.addEventListener("click", () => { soundOn = !soundOn; store.set("ecoville-sound", soundOn); initAudio(); if (soundOn) sfx.tap(); renderPhone(); });
}

// =====================================================================
//  DÉMARRAGE
// =====================================================================
const params = new URLSearchParams(location.search);
const MODE = params.get("salle") ? "phone" : "host";
checkVersion();
if (MODE === "phone") { document.querySelector(".bgclouds").hidden = true; startPhone(params.get("salle")); }
else { render(); startHost(); }
</script>

</body>
</html>
