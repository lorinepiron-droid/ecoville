<title>Écoville</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: univers BD — ciel animé, cases encrées à ombre dure ; écran = 6 quartiers illustrés + tableau des équipes ; téléphone = manette plein écran */
:root {
  color-scheme: light;
  --ink: #1d1d1b;
  --paper: #fffdf6;
  --sky1: #7fd0ff;
  --sky2: #dff5ff;
  --sun: #ffd23f;
  --leaf: #3fa34d;
  --leaf-d: #2a7a37;
  --red: #e4572e;
  --muted: #5b6470;
  --c-dech: #2fa35a; --c-plast: #1f86c9; --c-tel: #8a55c9; --c-ia: #d4447f; --c-mode: #ee7a2b; --c-alim: #c99a0b;
  --a1: #ef4b4b; --a2: #2f78e0; --a3: #f5b51b; --a4: #2fae62;
  --comic: "Bangers", "Impact", "Arial Black", sans-serif;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --shadow: 5px 5px 0 var(--ink);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--body); font-weight: 600; font-size: 17px; line-height: 1.4;
  background-color: var(--sky2);
  background-image: radial-gradient(rgba(29,29,27,0.07) 1.2px, transparent 1.3px), linear-gradient(180deg, var(--sky1), var(--sky2) 70%);
  background-size: 14px 14px, 100% 100%; background-attachment: fixed;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 40px;
  overflow-x: hidden;
}
.bgclouds { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.bgclouds svg { position: absolute; width: 220px; opacity: 0.9; animation: sail linear infinite; }
@keyframes sail { from { transform: translateX(-260px); } to { transform: translateX(calc(100vw + 40px)); } }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
h1, h2, h3 { margin: 0; line-height: 1.05; font-family: var(--display); font-weight: 400; text-wrap: balance; }
.panel { background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; min-width: 0; }
.btn { background: var(--sun); color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--ink); padding: 12px 24px; font-family: var(--display); font-size: 1.25rem; letter-spacing: 0.02em; transition: transform 0.08s, box-shadow 0.08s; }
.btn:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
.btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.green { background: var(--leaf); color: #fff; }
.btn.white { background: #fff; }
.btn.small { padding: 7px 14px; font-size: 1rem; box-shadow: 3px 3px 0 var(--ink); }
.btn.big { font-size: 1.6rem; padding: 14px 34px; }
.wrap { position: relative; z-index: 1; max-width: 1440px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.label { font-family: var(--comic); font-size: 1.05rem; letter-spacing: 0.06em; }
.hint { font-size: 0.9rem; color: var(--muted); margin: 0; }

/* ---------- logo ---------- */
.logo { font-family: var(--comic); font-weight: 400; letter-spacing: 0.04em; line-height: 0.9; color: var(--sun);
  -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--ink); transform: rotate(-3deg); display: inline-block; }
.logo .v { color: #7bd389; }

/* ---------- barre du haut ---------- */
.topbar { display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: center; justify-content: space-between; }
.topbar .logo { font-size: clamp(2.2rem, 4.4vw, 3.2rem); }
.citymeter { display: flex; align-items: center; gap: 10px; flex: 1 1 300px; max-width: 560px; background: #fff; border: 3px solid var(--ink); border-radius: 40px; padding: 6px 14px 6px 6px; box-shadow: 4px 4px 0 var(--ink); }
.citymeter svg { width: 40px; height: 40px; flex: none; }
.bar { flex: 1; height: 20px; border: 3px solid var(--ink); border-radius: 12px; background: #e9e3d6; overflow: hidden; }
.bar div { height: 100%; background: repeating-linear-gradient(-45deg, #5cc36b 0 10px, #4caf50 10px 20px); border-right: 3px solid var(--ink); transition: width 1s cubic-bezier(.2,1.4,.4,1); }
.pct { font-family: var(--comic); font-size: 1.6rem; letter-spacing: 0.04em; min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
.badge { font-family: var(--comic); font-size: 1.4rem; letter-spacing: 0.05em; background: var(--red); color: #fff; border: 3px solid var(--ink); border-radius: 12px; padding: 4px 14px; box-shadow: 3px 3px 0 var(--ink); transform: rotate(2deg); }
.iconbtn { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--ink); background: #fff; box-shadow: 3px 3px 0 var(--ink); display: grid; place-items: center; padding: 0; }
.iconbtn svg { width: 24px; height: 24px; }

/* ---------- tuiles quartier ---------- */
.city { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.tile { position: relative; padding: 0; border: 3px solid var(--ink); border-radius: 16px; background: var(--paper); box-shadow: var(--shadow); overflow: hidden; text-align: left; display: flex; flex-direction: column; min-width: 0; transition: transform 0.15s; }
button.tile:not(:disabled):hover { transform: translate(-2px, -3px) rotate(-0.6deg); box-shadow: 8px 8px 0 var(--ink); }
button.tile:not(:disabled):active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
button.tile:disabled { cursor: default; }
.tile.chosen { outline: 5px solid var(--sun); outline-offset: 3px; }
.scene { position: relative; aspect-ratio: 16 / 9; border-bottom: 3px solid var(--ink); overflow: hidden; max-width: 100%; }
.scene svg { display: block; width: 100%; height: 100%; }
.tinfo { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; color: #fff; }
.tname { font-family: var(--display); font-size: clamp(1.1rem, 1.7vw, 1.45rem); -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; text-shadow: 2px 2px 0 var(--ink); }
.tsub { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 800; font-size: 0.85rem; }
.tsub .pcts { font-family: var(--comic); font-size: 1.3rem; letter-spacing: 0.04em; text-shadow: 2px 2px 0 var(--ink); }
.jauge { height: 14px; border: 3px solid var(--ink); border-radius: 9px; background: rgba(255,255,255,0.35); overflow: hidden; }
.jauge div { height: 100%; background: #fff; transition: width 1s cubic-bezier(.2,1.4,.4,1); }
.stamp { position: absolute; top: 10px; left: 10px; font-family: var(--comic); font-size: 1.05rem; letter-spacing: 0.06em; padding: 2px 10px; border: 3px solid var(--ink); border-radius: 8px; transform: rotate(-6deg); box-shadow: 2px 2px 0 var(--ink); }
.stamp.p { background: #ff6b4a; color: #fff; } .stamp.c { background: var(--sun); } .stamp.r { background: #7bd389; }
.delta { position: absolute; right: 10px; top: 10px; font-family: var(--comic); font-size: 1.6rem; color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; animation: pop 0.6s cubic-bezier(.2,1.6,.4,1) both, floaty 2s 0.6s ease-in-out infinite alternate; }
@keyframes pop { from { transform: scale(0) rotate(-20deg); } to { transform: scale(1) rotate(4deg); } }
@keyframes floaty { to { transform: translateY(-5px) rotate(-3deg); } }

/* contenu animé des scènes : --h = santé (0..1), --b = 1 si restauré */
.sk { opacity: var(--h); transition: opacity 1.2s; }
.cl { opacity: calc((var(--h) - 0.3) * 2); transition: opacity 1.2s; }
.dt { opacity: calc((0.8 - var(--h)) * 2); transition: opacity 1.2s; }
.bl { opacity: var(--b); transition: opacity 1.2s; }
.drift { animation: drift 7s ease-in-out infinite alternate; }
.drift2 { animation: drift 11s ease-in-out infinite alternate-reverse; }
@keyframes drift { from { transform: translateX(-14px); } to { transform: translateX(14px); } }
.spin { animation: spin 3s linear infinite; }
.spinslow { animation: spin 18s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.wave { animation: wave 2.4s linear infinite; }
@keyframes wave { to { transform: translateX(-40px); } }
.bob { animation: bob 2.6s ease-in-out infinite alternate; }
.bob2 { animation: bob 1.9s ease-in-out infinite alternate-reverse; }
@keyframes bob { from { transform: translateY(-2px) rotate(-1.5deg); } to { transform: translateY(3px) rotate(1.5deg); } }
.blink { animation: blink 1.4s steps(2, jump-none) infinite; }
@keyframes blink { 50% { opacity: 0.25; } }
.rise { animation: rise 3.2s ease-out infinite; }
@keyframes rise { from { transform: translateY(0) scale(0.6); opacity: 0.9; } to { transform: translateY(-34px) scale(1.4); opacity: 0; } }
.buzz { animation: buzz 0.5s steps(3) infinite alternate; }
@keyframes buzz { 0% { transform: translate(0, 0); } 50% { transform: translate(3px, -2px); } 100% { transform: translate(-2px, 2px); } }
.jump { animation: jump 2.8s ease-in-out infinite; }
@keyframes jump { 0%, 55% { transform: translate(0, 24px) rotate(0); opacity: 0; } 60% { opacity: 1; } 75% { transform: translate(18px, -14px) rotate(-30deg); } 95% { transform: translate(36px, 24px) rotate(-120deg); opacity: 1; } 100% { opacity: 0; } }
.fly { animation: fly 6s ease-in-out infinite alternate; }
@keyframes fly { from { transform: translate(-10px, 4px); } to { transform: translate(24px, -6px); } }
.twinkle { animation: twinkle 1.6s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: 0.2; } to { opacity: 1; } }

/* ---------- mascotte ---------- */
.mascot { width: 96px; height: 96px; flex: none; animation: hop 1.6s ease-in-out infinite; }
.mascot.sm { width: 64px; height: 64px; }
@keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px) rotate(-3deg); } }
.bubble { position: relative; background: #fff; border: 3px solid var(--ink); border-radius: 18px; padding: 12px 16px; box-shadow: 4px 4px 0 var(--ink); font-weight: 800; }
.bubble::before { content: ""; position: absolute; left: -16px; top: 22px; border: 10px solid transparent; border-right: 14px solid var(--ink); }
.bubble::after { content: ""; position: absolute; left: -10px; top: 24px; border: 8px solid transparent; border-right: 11px solid #fff; }
.talk { display: flex; align-items: center; gap: 18px; }

/* ---------- accueil ---------- */
.hero { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px; }
.hero .logo { font-size: clamp(3.4rem, 9vw, 6.5rem); }
.hero .tagline { font-family: var(--display); font-size: clamp(1.1rem, 2vw, 1.5rem); margin-top: 6px; }
.lobby { display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.2fr); gap: 20px; align-items: start; }
.join { display: grid; grid-template-columns: minmax(0, 230px) minmax(0, 1fr); gap: 20px; align-items: center; }
.qr { background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 8px; width: 100%; max-width: 230px; aspect-ratio: 1; display: grid; place-items: center; box-shadow: 4px 4px 0 var(--ink); transform: rotate(-2deg); }
.qr svg { width: 100%; height: auto; display: block; }
.code { font-family: var(--comic); font-size: clamp(3rem, 6vw, 4.4rem); letter-spacing: 0.12em; color: var(--red); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink); line-height: 1; }
.url { font-size: 0.8rem; color: var(--muted); overflow-wrap: anywhere; }
.netnote { border: 3px dashed var(--ink); border-radius: 12px; padding: 12px 14px; background: #fff4d1; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-family: var(--comic); letter-spacing: 0.06em; font-size: 1.05rem; }
select, input[type=text] { font: inherit; font-weight: 800; padding: 9px 10px; border-radius: 10px; border: 3px solid var(--ink); background: #fff; color: var(--ink); width: 100%; min-width: 0; }
.teamlist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.teamedit { display: flex; align-items: center; gap: 8px; min-width: 0; }
.avatar { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--ink); display: grid; place-items: center; flex: none; font-family: var(--comic); font-size: 1.3rem; color: #fff; -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; box-shadow: 2px 2px 0 var(--ink); }
.joined { font-family: var(--comic); letter-spacing: 0.05em; font-size: 0.9rem; flex: none; padding: 2px 8px; border-radius: 8px; border: 2px solid var(--ink); background: #eee; }
.joined.on { background: #7bd389; }
.steps { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; counter-reset: s; }
.steps li { display: flex; gap: 10px; align-items: center; font-weight: 800; }
.steps li::before { counter-increment: s; content: counter(s); width: 28px; height: 28px; flex: none; border-radius: 50%; border: 2px solid var(--ink); background: var(--sun); display: grid; place-items: center; font-family: var(--comic); font-size: 1rem; }

/* ---------- jeu ---------- */
.game { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.stage { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.prompt { font-family: var(--display); font-size: clamp(1.3rem, 2.4vw, 1.9rem); }
.qwrap { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.5fr); gap: 18px; align-items: stretch; }
.qwrap .tile { align-self: start; }
.qcard { position: relative; display: flex; flex-direction: column; gap: 14px; }
.qtop { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.qkind { font-family: var(--comic); font-size: 1.2rem; letter-spacing: 0.06em; color: #fff; background: var(--dom); border: 3px solid var(--ink); border-radius: 10px; padding: 2px 12px; box-shadow: 3px 3px 0 var(--ink); transform: rotate(-2deg); display: inline-block; }
.qtext { font-family: var(--display); font-size: clamp(1.5rem, 3vw, 2.4rem); line-height: 1.15; margin: 0; }
.ring { width: 86px; height: 86px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--comic); font-size: 2rem; }
.ring.hurry { animation: shake 0.3s linear infinite; }
@keyframes shake { 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.opt { position: relative; display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 14px; border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); color: #fff; font-weight: 900; font-size: clamp(1.05rem, 1.8vw, 1.35rem); min-width: 0; text-shadow: 1px 1px 0 rgba(0,0,0,0.35); transition: opacity 0.4s, transform 0.4s, filter 0.4s; }
.opt .k { width: 2.1em; height: 2.1em; border-radius: 50%; display: grid; place-items: center; background: #fff; color: var(--ink); border: 3px solid var(--ink); font-family: var(--comic); font-size: 1.15em; flex: none; text-shadow: none; }
.k1 { background: var(--a1); } .k2 { background: var(--a2); } .k3 { background: var(--a3); } .k4 { background: var(--a4); }
.opt.dim { opacity: 0.35; filter: grayscale(1); transform: scale(0.97); }
.opt.right { animation: wiggle 0.6s ease-in-out 2; outline: 5px solid var(--sun); outline-offset: 2px; }
.opt.right::after { content: "✔"; position: absolute; right: -10px; top: -14px; width: 40px; height: 40px; border-radius: 50%; background: #7bd389; border: 3px solid var(--ink); display: grid; place-items: center; font-size: 1.3rem; color: var(--ink); text-shadow: none; }
@keyframes wiggle { 25% { transform: rotate(-2deg) scale(1.03); } 75% { transform: rotate(2deg) scale(1.03); } }
.burst { position: relative; display: grid; place-items: center; width: 150px; height: 150px; flex: none; animation: pop 0.5s cubic-bezier(.2,1.6,.4,1) both; }
.burst svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.burst span { position: relative; font-family: var(--comic); font-size: 1.5rem; text-align: center; line-height: 1; transform: rotate(-6deg); }
.burst span b { display: block; font-size: 2.4rem; font-weight: 400; }
.revealrow { display: flex; gap: 16px; align-items: center; }
.expl { background: #fff4d1; border: 3px solid var(--ink); border-radius: 14px; padding: 12px 16px; font-size: 1.08rem; flex: 1; min-width: 0; }

.side { display: flex; flex-direction: column; gap: 14px; }
.side h2 { font-family: var(--comic); letter-spacing: 0.05em; font-size: 1.8rem; }
.teams { display: flex; flex-direction: column; gap: 10px; }
.team { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 8px 10px; border-radius: 14px; border: 3px solid var(--ink); background: #fff; position: relative; transition: transform 0.3s; }
.team.chooser { background: #fff4d1; }
.team .avatar { grid-row: span 2; }
.team .nm { font-family: var(--display); font-size: 1.15rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team .sc { font-family: var(--comic); font-size: 1.7rem; letter-spacing: 0.03em; font-variant-numeric: tabular-nums; grid-row: span 2; }
.team .sub { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 0.8rem; font-weight: 800; color: var(--muted); }
.crown { position: absolute; top: -12px; left: 2px; font-family: var(--comic); font-size: 0.85rem; letter-spacing: 0.05em; background: var(--sun); border: 2px solid var(--ink); border-radius: 6px; padding: 0 6px; transform: rotate(-6deg); }
.pill { font-family: var(--comic); letter-spacing: 0.05em; font-size: 0.85rem; padding: 1px 8px; border-radius: 7px; border: 2px solid var(--ink); background: #eee; color: var(--ink); }
.pill.ok { background: #7bd389; } .pill.ko { background: #ff8a70; } .pill.wait { background: var(--sun); }
.manual { display: flex; gap: 4px; }
.manual button { width: 28px; height: 26px; border-radius: 7px; border: 2px solid var(--ink); color: #fff; font-family: var(--comic); font-size: 0.95rem; opacity: 0.35; padding: 0; }
.manual button.sel { opacity: 1; box-shadow: 2px 2px 0 var(--ink); }

.news { position: relative; display: flex; flex-direction: column; gap: 12px; background: #fff; }
.news .flash { font-family: var(--comic); font-size: 1.3rem; letter-spacing: 0.08em; background: var(--red); color: #fff; border: 3px solid var(--ink); align-self: flex-start; padding: 2px 14px; transform: rotate(-3deg); box-shadow: 3px 3px 0 var(--ink); }
.news.good .flash { background: var(--leaf); }
.news h2 { font-family: var(--comic); font-size: clamp(2.2rem, 5vw, 3.6rem); letter-spacing: 0.04em; }
.news p { font-size: 1.2rem; margin: 0; max-width: 60ch; }
.news .effect { font-family: var(--display); font-size: 1.4rem; }
.end h2 { font-family: var(--comic); font-size: clamp(2.6rem, 6vw, 4.6rem); letter-spacing: 0.04em; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--ink); }
.podium { display: flex; flex-direction: column; gap: 8px; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 30; }
.confetti i { position: absolute; top: -20px; width: 12px; height: 18px; border: 2px solid var(--ink); animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

/* ---------- téléphone ---------- */
.phone { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.ph-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ph-head .logo { font-size: 2.2rem; }
.ph-team { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 16px; border: 3px solid var(--ink); box-shadow: var(--shadow); color: #fff; font-family: var(--display); font-size: 1.35rem; -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; }
.ph-team .sc { margin-left: auto; font-family: var(--comic); font-size: 1.4rem; letter-spacing: 0.04em; }
.ph-big { font-family: var(--display); font-size: 1.6rem; line-height: 1.2; text-align: center; }
.ph-sub { text-align: center; color: var(--muted); font-weight: 800; margin: 0; }
.ph-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ph-pick button { border: 3px solid var(--ink); border-radius: 16px; box-shadow: 4px 4px 0 var(--ink); padding: 0; color: #fff; text-align: left; display: flex; flex-direction: column; overflow: hidden; background: #fff; }
.ph-pick button .nmx { padding: 10px 12px; font-family: var(--display); font-size: 1.15rem; -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; display: flex; flex-direction: column; gap: 2px; }
.ph-pick button small { font-family: var(--body); font-weight: 800; font-size: 0.8rem; -webkit-text-stroke: 0; }
.ph-pick button:disabled { opacity: 0.35; }
.ph-pick button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.ph-pick .scene { aspect-ratio: 16 / 9; }
.ph-q { font-family: var(--display); font-size: 1.3rem; line-height: 1.2; }
.ph-ans { display: grid; gap: 12px; }
.ph-ans button { border: 3px solid var(--ink); border-radius: 16px; box-shadow: 4px 4px 0 var(--ink); padding: 14px; color: #fff; font-size: 1.15rem; font-weight: 900; text-align: left; display: flex; gap: 12px; align-items: center; min-height: 68px; text-shadow: 1px 1px 0 rgba(0,0,0,0.35); }
.ph-ans button .k { width: 2em; height: 2em; border-radius: 50%; background: #fff; color: var(--ink); border: 3px solid var(--ink); display: grid; place-items: center; font-family: var(--comic); font-size: 1.3rem; flex: none; text-shadow: none; }
.ph-ans button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.ph-ans button.sel { outline: 5px solid var(--sun); outline-offset: 2px; }
.ph-ans button:disabled:not(.sel) { opacity: 0.3; filter: grayscale(1); }
.ph-res { border: 3px solid var(--ink); border-radius: 18px; box-shadow: var(--shadow); padding: 22px 16px; text-align: center; }
.ph-res.ok { background: #7bd389; } .ph-res.ko { background: #ff8a70; } .ph-res.none { background: #ddd; }
.ph-res .big { font-family: var(--comic); font-size: 2.8rem; letter-spacing: 0.04em; line-height: 1; animation: pop 0.5s cubic-bezier(.2,1.6,.4,1) both; }
.ph-conn { font-family: var(--comic); letter-spacing: 0.05em; font-size: 0.95rem; background: #fff; border: 2px solid var(--ink); border-radius: 8px; padding: 2px 8px; }
.ph-conn.off { background: #ff8a70; }
.ph-timer { font-family: var(--comic); font-size: 1.6rem; background: var(--sun); border: 3px solid var(--ink); border-radius: 12px; padding: 0 10px; box-shadow: 3px 3px 0 var(--ink); }

@media (max-width: 1100px) {
  .game, .lobby { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .city { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .qwrap { grid-template-columns: minmax(0, 1fr); }
  .qwrap .tile { display: none; }
  .opts { grid-template-columns: minmax(0, 1fr); }
  .join { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
  .form, .teamlist { grid-template-columns: minmax(0, 1fr); }
  .revealrow { flex-direction: column; align-items: stretch; }
  .burst { align-self: center; }
  .tinfo { padding: 8px; }
  .stamp { font-size: 0.85rem; }
}
@media (max-width: 460px) {
  .city { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {

  { name: "Les Séquoias", color: "#8a55c9" },
];
const YEARS = ["1re", "2e", "3e", "4e", "5e", "6e"];
const degreeOf = y => (y <= 2 ? 1 : y <= 4 ? 2 : 3);
const START_HEALTH = 20, GOAL = 80;
const PEER_PREFIX = "ecoville-qst-";
const LETTERS = "ABCD";

// ---------- utilitaires ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const newRoom = () => Array.from({ length: 4 }, () => "ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.floor(Math.random() * 24)]).join("");
const stateOf = h => (h >= GOAL ? ["r", "RESTAURÉ !"] : h >= 50 ? ["c", "ÇA S'AMÉLIORE"] : ["p", "POLLUÉ"]);
const initial = n => (String(n).replace(/^(les|la|le|l'|team)\s*/i, "").charAt(0) || "?").toUpperCase();
const avatar = (name, color) => `<span class="avatar" style="background:${color}">${esc(initial(name))}</span>`;

// ---------- sons (Web Audio, après un clic) ----------
let AC = null, soundOn = store.get("ecoville-sound") ?? true;
function initAudio() { if (!AC) try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch {} if (AC && AC.state === "suspended") AC.resume().catch(() => {}); }
function tone(f, d, type = "square", when = 0, vol = 0.05) {
  if (!soundOn || !AC) return;
  try {
    const o = AC.createOscillator(), gn = AC.createGain(), t = AC.currentTime + when;
    o.type = type; o.frequency.value = f; gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + d + 0.03);
  } catch {}
}
const sfx = {
  start() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, "square", i * 0.1)); },
  pick() { tone(660, 0.08); tone(990, 0.12, "square", 0.08); },
  tick() { tone(880, 0.05, "triangle", 0, 0.06); },
  good() { [523, 659, 784].forEach((f, i) => tone(f, 0.16, "square", i * 0.09)); tone(1047, 0.35, "square", 0.27); },
  bad() { tone(220, 0.25, "sawtooth", 0, 0.04); tone(165, 0.35, "sawtooth", 0.2, 0.04); },
  event() { tone(392, 0.15, "square", 0); tone(330, 0.15, "square", 0.16); tone(392, 0.3, "square", 0.32); },
  win() { [523, 523, 523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, "square", i * 0.14)); },
};

// =====================================================================
//  MODE ÉCRAN (hôte)
// =====================================================================
const saved = store.get("ecoville-setup") || {};
const G = {
  room: saved.room || newRoom(),
  year: saved.year || 3, nTeams: saved.nTeams || 6, rounds: saved.rounds || 18, timer: saved.timer || 30,
  names: saved.names || TEAM_PRESETS.map(t => t.name),
  phase: "lobby", teams: [], districts: DISTRICTS.map(d => ({ ...d, h: START_HEALTH })), round: 0, chooser: 0, cur: null, used: [], event: null, lastDelta: null,
};
let net = "connecting"; // connecting | on | off
let peer = null;
const conns = new Map(); // peerId -> { conn, team }
let tickHandle = null, lastSec = null;

function saveSetup() { store.set("ecoville-setup", { room: G.room, year: G.year, nTeams: G.nTeams, rounds: G.rounds, timer: G.timer, names: G.names }); }
function phoneUrl() { return location.href.split("#")[0].split("?")[0] + "?salle=" + G.room; }

function startHost() {
  if (typeof Peer === "undefined" || typeof RTCPeerConnection === "undefined") { net = "off"; return render(); }
  let p;
  try { p = new Peer(PEER_PREFIX + G.room.toLowerCase(), { debug: 0 }); } catch { net = "off"; return render(); }
  peer = p;
  const failTimer = setTimeout(() => { if (net !== "on") { net = "off"; render(); } }, 12000);
  p.on("open", () => { clearTimeout(failTimer); net = "on"; render(); });
  p.on("connection", conn => {
    conn.on("open", () => { conns.set(conn.peer, { conn, team: null }); sendView(conn.peer); });
    conn.on("data", d => onPhone(conn.peer, d));
    conn.on("close", () => { conns.delete(conn.peer); render(); });
    conn.on("error", () => {});
  });
  p.on("disconnected", () => { try { p.reconnect(); } catch {} });
  p.on("error", e => {
    if (e.type === "unavailable-id") { clearTimeout(failTimer); p.destroy(); G.room = newRoom(); saveSetup(); startHost(); render(); }
    else if (["browser-incompatible", "network", "server-error", "socket-error", "ssl-unavailable"].includes(e.type) && net !== "on") { clearTimeout(failTimer); net = "off"; render(); }
  });
}

function teamHasPhone(i) { for (const c of conns.values()) if (c.team === i) return true; return false; }

function onPhone(pid, d) {
  const c = conns.get(pid); if (!c || !d || typeof d !== "object") return;
  if (d.t === "join" && Number.isInteger(d.team) && d.team >= 0 && d.team < G.nTeams) { c.team = d.team; render(); }
  else if (d.t === "pick" && G.phase === "choose" && c.team === G.chooser && DMAP[d.k]) chooseDistrict(d.k);
  else if (d.t === "ans" && G.phase === "question" && c.team != null && Number.isInteger(d.i) && d.qid === G.cur.qid) setAnswer(c.team, d.i, false);
  else if (d.t === "hello") sendView(pid);
}

function viewFor(team) {
  const v = { phase: G.phase, round: G.round, rounds: G.rounds, room: G.room,
    teams: (G.phase === "lobby" ? G.names.slice(0, G.nTeams) : G.teams.map(t => t.name)).map((n, i) => ({ name: n, color: TEAM_PRESETS[i].color, phone: teamHasPhone(i) })) };
  if (team == null || team >= G.nTeams) return v;
  v.team = team;
  if (G.phase !== "lobby") {
    const t = G.teams[team];
    const ranked = G.teams.map((x, i) => ({ s: x.score, i })).sort((a, b) => b.s - a.s);
    v.me = { score: t.score, rank: ranked.findIndex(r => r.i === team) + 1 };
    v.chooserName = G.teams[G.chooser]?.name; v.isChooser = G.chooser === team;
  }
  if (G.phase === "choose") v.districts = G.districts.map(d => ({ k: d.k, name: d.name, theme: d.theme, h: Math.round(d.h) }));
  if (G.phase === "question" || G.phase === "reveal") {
    const c = G.cur;
    v.q = { qid: c.qid, text: c.text, opts: c.opts, theme: DMAP[c.k].theme, district: DMAP[c.k].name,
      left: Math.max(0, Math.ceil((c.endsAt - Date.now()) / 1000)), mine: G.teams[team].ans };
  }
  if (G.phase === "reveal") { const t = G.teams[team]; v.res = { ok: t.ok, gain: t.gain, correct: G.cur.opts[G.cur.correct], expl: G.cur.e }; }
  if (G.phase === "event") v.event = { title: G.event.title, text: G.event.text, good: !!G.event.good };
  if (G.phase === "end") v.won = G.districts.every(d => d.h >= GOAL);
  return v;
}
function sendView(pid) { const c = conns.get(pid); if (c && c.conn.open) { try { c.conn.send(viewFor(c.team)); } catch {} } }
function broadcast() { for (const pid of conns.keys()) sendView(pid); }

// ---------- déroulement ----------
function startGame() {
  initAudio(); sfx.start();
  saveSetup();
  G.teams = G.names.slice(0, G.nTeams).map((n, i) => ({ name: (n || "").trim() || TEAM_PRESETS[i].name, color: TEAM_PRESETS[i].color, score: 0, ans: null, at: 0, ok: null, gain: 0 }));
  G.districts = DISTRICTS.map(d => ({ ...d, h: START_HEALTH }));
  G.round = 0; G.used = []; G.event = null; G.lastDelta = null;
  G.eventDeck = shuffle(EVENTS);
  $("#confetti").innerHTML = "";
  nextRound();
}
function nextRound() {
  G.round++; G.chooser = (G.round - 1) % G.nTeams; G.phase = "choose"; G.cur = null; G.lastDelta = null;
  render();
}
function pickQuestion(k) {
  const deg = degreeOf(G.year);
  const fits = q => q.k === k && q.l <= deg;
  let pool = Q.map((q, i) => ({ q, i })).filter(o => fits(o.q) && !G.used.includes(o.i));
  if (!pool.length) { G.used = G.used.filter(i => !fits(Q[i])); pool = Q.map((q, i) => ({ q, i })).filter(o => fits(o.q)); }
  const exact = pool.filter(o => o.q.l === deg);
  const src = exact.length && Math.random() < 0.7 ? exact : pool;
  const o = src[Math.floor(Math.random() * src.length)];
  G.used.push(o.i);
  return o.q;
}
function chooseDistrict(k) {
  if (G.phase !== "choose") return;
  initAudio(); sfx.pick();
  const q = pickQuestion(k);
  let opts, correct;
  if (q.t === "vf") { opts = ["Vrai", "Faux"]; correct = q.v ? 0 : 1; }
  else { const order = shuffle(q.a.map((_, i) => i)); opts = order.map(i => q.a[i]); correct = order.indexOf(0); }
  G.cur = { k, qid: Math.random().toString(36).slice(2, 8), text: q.q, opts, correct, e: q.e, type: q.t, start: Date.now(), endsAt: Date.now() + G.timer * 1000 };
  G.teams.forEach(t => { t.ans = null; t.at = 0; t.ok = null; t.gain = 0; });
  G.phase = "question"; lastSec = null;
  clearInterval(tickHandle);
  tickHandle = setInterval(tick, 200);
  render();
}
const RING_C = 2 * Math.PI * 36;
function tick() {
  if (G.phase !== "question") { clearInterval(tickHandle); return; }
  const left = G.cur.endsAt - Date.now(), sec = Math.max(0, Math.ceil(left / 1000));
  const tv = $("#tleft"), rc = $("#ringc"), rg = $("#ring");
  if (tv) tv.textContent = sec;
  if (rc) rc.style.strokeDashoffset = RING_C * (1 - Math.max(0, left) / (G.timer * 1000));
  if (rg) rg.classList.toggle("hurry", sec <= 5);
  if (sec !== lastSec) { if (sec <= 5 && sec > 0) sfx.tick(); lastSec = sec; }
  if (left <= 0) reveal();
}
function setAnswer(team, i, manual) {
  if (G.phase !== "question" || i < 0 || i >= G.cur.opts.length) return;
  const t = G.teams[team];
  if (t.ans != null && !manual) return;
  t.ans = i; t.at = Date.now();
  if (G.teams.every(x => x.ans != null)) { setTimeout(() => { if (G.phase === "question") reveal(); }, 700); }
  render();
}
function reveal() {
  if (G.phase !== "question") return;
  clearInterval(tickHandle);
  const c = G.cur, d = G.districts.find(x => x.k === c.k);
  const per = 960 / (G.nTeams * G.rounds); // calibré : ~50 % de bonnes réponses bien réparties suffisent
  let nOk = 0;
  G.teams.forEach((t, i) => {
    if (t.ans == null) { t.ok = null; t.gain = 0; return; }
    t.ok = t.ans === c.correct;
    if (t.ok) {
      nOk++;
      const speed = Math.max(0, Math.min(1, (c.endsAt - t.at) / (G.timer * 1000)));
      t.gain = (100 + Math.round(50 * speed)) * (i === G.chooser ? 2 : 1);
      t.score += t.gain;
    } else t.gain = 0;
  });
  const before = d.h;
  d.h = Math.min(100, d.h + nOk * per);
  G.lastDelta = { k: c.k, d: Math.round(d.h - before), nOk };
  G.phase = "reveal";
  nOk > 0 ? sfx.good() : sfx.bad();
  render();
}
function afterReveal() {
  if (G.phase !== "reveal") return;
  if (G.round >= G.rounds) { G.phase = "end"; render(); return endFx(); }
  if (G.round % 4 === 0) {
    const ev = G.eventDeck.shift() || shuffle(EVENTS)[0];
    if (!G.eventDeck.length) G.eventDeck = shuffle(EVENTS);
    [ev.k, ev.k2].filter(Boolean).forEach(k => { const d = G.districts.find(x => x.k === k); d.h = Math.max(0, Math.min(100, d.h + ev.d)); });
    G.event = ev; G.phase = "event"; G.lastDelta = null;
    sfx.event();
    return render();
  }
  nextRound();
}
function endFx() {
  const won = G.districts.every(d => d.h >= GOAL);
  if (won) sfx.win(); else sfx.event();
  if (!won || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors = ["#ef4b4b", "#2f78e0", "#f5b51b", "#2fae62", "#ec5f9e", "#8a55c9"];
  $("#confetti").innerHTML = Array.from({ length: 80 }, () => `<i style="left:${Math.random() * 100}%;background:${colors[Math.floor(Math.random() * 6)]};animation-duration:${2.5 + Math.random() * 3}s;animation-delay:${Math.random() * 1.5}s"></i>`).join("");
}

// ---------- rendu écran ----------
function planetHealth() { return G.districts.reduce((s, d) => s + d.h, 0) / G.districts.length; }

function topbar() {
  const h = Math.round(planetHealth());
  return `<header class="topbar">
    <span class="logo">ÉCO<span class="v">VILLE</span></span>
    ${G.phase !== "lobby" ? `<div class="citymeter" role="meter" aria-label="Santé de la ville" aria-valuenow="${h}" aria-valuemin="0" aria-valuemax="100">${GLOBE}<div class="bar"><div style="width:${h}%"></div></div><span class="pct">${h}%</span></div>
    <span class="badge">MANCHE ${G.round}/${G.rounds}</span>` : ""}
    <button class="iconbtn" id="sound" aria-label="${soundOn ? "Couper le son" : "Activer le son"}" title="Son">${soundOn ? SOUND_ON : SOUND_OFF}</button>
  </header>`;
}

function tile(d, clickable) {
  const h = Math.round(d.h), [st, lbl] = stateOf(d.h);
  const delta = G.lastDelta && G.lastDelta.k === d.k && G.lastDelta.d ? `<span class="delta">+${G.lastDelta.d}%</span>` : "";
  const chosen = G.cur && G.cur.k === d.k && G.phase === "reveal" ? "chosen" : "";
  const tag = clickable ? "button" : "div";
  return `<${tag} class="tile ${chosen}" ${clickable ? `data-k="${d.k}"` : ""} style="--h:${(d.h / 100).toFixed(3)};--b:${d.h >= GOAL ? 1 : 0}" aria-label="${esc(d.name)}, ${esc(d.theme)}, santé ${h} %">
    <div class="scene">${SCENES[d.k]}<span class="stamp ${st}">${lbl}</span>${delta}</div>
    <div class="tinfo" style="background:${d.color}">
      <span class="tname">${esc(d.name)}</span>
      <div class="tsub"><span>${esc(d.theme)}</span><span class="pcts">${h}%</span></div>
      <div class="jauge"><div style="width:${h}%"></div></div>
    </div>
  </${tag}>`;
}

function renderLobby() {
  const url = phoneUrl();
  const joinBlock = net === "on" ? `
      <div class="join">
        <div class="qr" id="qr" aria-label="QR code pour rejoindre la partie"></div>
        <div style="display:flex;flex-direction:column;gap:10px;min-width:0">
          <span class="label">CODE DE LA SALLE</span>
          <span class="code">${esc(G.room)}</span>
          <ol class="steps"><li>Un téléphone par équipe scanne le QR code</li><li>Chaque groupe choisit son équipe</li><li>On lance la quête !</li></ol>
          <span class="url">${esc(url)}</span>
        </div>
      </div>` : net === "connecting" ? `<p class="netnote">Ouverture de la salle pour les téléphones…</p>` : `
      <div class="netnote"><b>Pas de téléphones ici.</b> Cette page n'arrive pas à ouvrir de salle en ligne (le réseau ou l'hébergement bloque la connexion). Vous pouvez quand même jouer : chaque groupe annonce sa réponse et l'enseignant clique la lettre à l'écran.</div>`;
  const teamRows = G.names.slice(0, G.nTeams).map((n, i) => `
      <div class="teamedit">${avatar(n, TEAM_PRESETS[i].color)}
        <input type="text" id="tn${i}" data-i="${i}" value="${esc(n)}" maxlength="22" aria-label="Nom de l'équipe ${i + 1}">
        <span class="joined ${teamHasPhone(i) ? "on" : ""}">${teamHasPhone(i) ? "PRÊTE !" : "…"}</span></div>`).join("");
  return `
  <header class="hero">
    <div><span class="logo">ÉCO<span class="v">VILLE</span></span><div class="tagline">La quête écologique de toute la classe</div></div>
    <div class="row" style="gap:14px"><button class="iconbtn" id="sound" aria-label="${soundOn ? "Couper le son" : "Activer le son"}">${soundOn ? SOUND_ON : SOUND_OFF}</button></div>
  </header>
  <div class="talk">${MASCOT}<div class="bubble">Au secours ! Les six quartiers d'Écoville sont pollués. Répondez juste pour les soigner : si tous atteignent <b>${GOAL} %</b> avant la fin, toute la classe gagne !</div></div>
  <section class="lobby">
    <div class="panel" style="display:flex;flex-direction:column;gap:14px">
      <h2 class="label" style="font-size:1.8rem">REJOINDRE LA PARTIE</h2>
      ${joinBlock}
    </div>
    <div class="panel">
      <h2 class="label" style="font-size:1.8rem">RÉGLAGES</h2>
      <div class="form">
        <div class="field"><label for="year">Classe</label><select id="year">${YEARS.map((y, i) => `<option value="${i + 1}" ${G.year === i + 1 ? "selected" : ""}>${y} secondaire</option>`).join("")}</select></div>
        <div class="field"><label for="nteams">Équipes</label><select id="nteams">${[2, 3, 4, 5, 6].map(n => `<option ${G.nTeams === n ? "selected" : ""}>${n}</option>`).join("")}</select></div>
        <div class="field"><label for="rounds">Durée</label><select id="rounds">${[[12, "12 manches · ~25 min"], [18, "18 manches · ~40 min"], [24, "24 manches · ~50 min"]].map(([v, l]) => `<option value="${v}" ${G.rounds === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
        <div class="field"><label for="timer">Temps par question</label><select id="timer">${[20, 30, 45, 60].map(v => `<option value="${v}" ${G.timer === v ? "selected" : ""}>${v} secondes</option>`).join("")}</select></div>
      </div>
      <div class="teamlist">${teamRows}</div>
      <div class="row" style="margin-top:18px;justify-content:space-between"><button class="btn green big" id="start">C'EST PARTI !</button>
        <span class="hint">${Q.length} questions · 6 quartiers</span></div>
    </div>
  </section>
  <div class="city">${G.districts.map(d => tile(d, false)).join("")}</div>`;
}

function teamsPanel() {
  const ranked = G.teams.map((t, i) => ({ t, i })).sort((a, b) => b.t.score - a.t.score);
  const q = G.phase === "question";
  const rows = G.teams.map((t, i) => {
    let state = "";
    if (q) state = t.ans != null ? `<span class="pill wait">A RÉPONDU</span>` : `<span class="pill">RÉFLÉCHIT…</span>`;
    if (G.phase === "reveal") state = t.ok == null ? `<span class="pill">PAS DE RÉPONSE</span>` : t.ok ? `<span class="pill ok">+${t.gain}</span>` : `<span class="pill ko">RATÉ</span>`;
    const manual = q ? `<span class="manual" aria-label="Saisie manuelle">${G.cur.opts.map((_, k) => `<button class="k${k + 1} ${t.ans === k ? "sel" : ""}" data-team="${i}" data-a="${k}" aria-label="${esc(t.name)} répond ${LETTERS[k]}">${LETTERS[k]}</button>`).join("")}</span>` : "";
    const isCh = i === G.chooser && G.phase !== "end";
    return `<div class="team ${isCh ? "chooser" : ""}">${isCh ? `<span class="crown">CHOISIT · ×2</span>` : ""}
      ${avatar(t.name, t.color)}<span class="nm">${esc(t.name)}</span><span class="sc">${t.score}</span>
      <div class="sub">${teamHasPhone(i) ? `<span class="pill ok">TÉL.</span>` : ""} ${state} ${manual}</div></div>`;

      ${q ? `<p class="hint" style="margin-top:10px">Sans téléphone ? Cliquez la lettre annoncée par l'équipe.</p>` : ""}
    </div>

}

function questionCard() {
  const c = G.cur, d = G.districts.find(x => x.k === c.k), rev = G.phase === "reveal";
  const left = Math.max(0, Math.ceil((c.endsAt - Date.now()) / 1000));
  const typeLbl = c.type === "tri" ? "TRI DES DÉCHETS" : c.type === "vf" ? "VRAI OU FAUX ?" : "QUESTION";
  const n = rev ? G.lastDelta.nOk : 0;
  const ring = `<div class="ring" id="ring"><svg viewBox="0 0 86 86"><circle cx="43" cy="43" r="36" fill="#fff" stroke="${I}" stroke-width="4"/><circle id="ringc" cx="43" cy="43" r="36" fill="none" stroke="${d.color}" stroke-width="9" stroke-dasharray="${RING_C}" stroke-dashoffset="${RING_C * (1 - left / G.timer)}"/><circle cx="43" cy="43" r="41" fill="none" stroke="${I}" stroke-width="3"/></svg><span id="tleft">${left}</span></div>`;
  return `<div class="qwrap">${tile(d, false)}
    <div class="panel qcard" style="--dom:${d.color}">
      <div class="qtop"><div style="display:flex;flex-direction:column;gap:10px;min-width:0"><span><span class="qkind">${typeLbl}</span></span><p class="qtext">${esc(c.text)}</p></div>${rev ? "" : ring}</div>
      <div class="opts">${c.opts.map((o, k) => `<div class="opt k${k + 1} ${rev ? (k === c.correct ? "right" : "dim") : ""}"><span class="k">${LETTERS[k]}</span><span>${esc(o)}</span></div>`).join("")}</div>
      ${rev ? `<div class="revealrow"><div class="burst">${BURST(n ? "#ffd23f" : "#ff8a70")}<span><b>${n}/${G.nTeams}</b>${n > 1 ? "ÉQUIPES" : "ÉQUIPE"}<br>${n ? "BRAVO !" : "AÏE !"}</span></div><div class="expl">${esc(c.e)}</div></div>
        <div class="row" style="justify-content:flex-end"><button class="btn big" id="next">${G.round >= G.rounds ? "RÉSULTAT FINAL" : "MANCHE SUIVANTE"} ➜</button></div>`
        : `<div class="row" style="justify-content:flex-end"><button class="btn white small" id="revealnow">Corriger maintenant</button></div>`}
    </div></div>`;
}

function renderGame() {
  let stage = "";
  const chooser = G.teams[G.chooser];
  if (G.phase === "choose") {
    stage = `<div class="talk">${MASCOT.replace('class="mascot"', 'class="mascot sm"')}<div class="bubble prompt">${avatar(chooser.name, chooser.color).replace('class="avatar"', 'class="avatar" style="display:inline-grid;vertical-align:middle;margin-right:6px;background:' + chooser.color + '"')}<b>${esc(chooser.name)}</b>, quel quartier voulez-vous sauver ?
      <div class="hint" style="margin-top:4px">${teamHasPhone(G.chooser) ? "Choisissez sur votre téléphone (ou cliquez ici)." : "Cliquez sur le quartier annoncé."} Votre bonne réponse comptera double !</div></div></div>
      <div class="city">${G.districts.map(d => tile(d, true)).join("")}</div>`;
  } else if (G.phase === "question") {
    stage = questionCard();
  } else if (G.phase === "reveal") {
    stage = questionCard() + `<div class="city">${G.districts.map(d => tile(d, false)).join("")}</div>`;
  } else if (G.phase === "event") {
    const ev = G.event, names = [ev.k, ev.k2].filter(Boolean).map(k => DMAP[k].name).join(" et ");
    stage = `<div class="panel news ${ev.good ? "good" : ""}">
      <span class="flash">${ev.good ? "BONNE NOUVELLE" : "FLASH INFO"}</span><h2>${esc(ev.title.toUpperCase())}</h2><p>${esc(ev.text)}</p>
      <p class="effect">${esc(names)} : ${ev.d > 0 ? "+" : ""}${ev.d} %</p>
      <div class="row" style="justify-content:flex-end"><button class="btn big" id="evnext">CONTINUER ➜</button></div></div>
      <div class="city">${G.districts.map(d => tile(d, false)).join("")}</div>`;
  } else if (G.phase === "end") {
    const won = G.districts.every(d => d.h >= GOAL);
    const ranked = G.teams.map((t, i) => ({ t, i })).sort((a, b) => b.t.score - a.t.score);
    stage = `<div class="panel end" style="display:flex;flex-direction:column;gap:14px">
      <div class="talk">${MASCOT}<div class="bubble">${won ? "Merci ! Grâce à vous, Écoville respire à nouveau !" : `${G.districts.filter(d => d.h >= GOAL).length} quartier(s) sur 6 restauré(s). Encore un effort la prochaine fois !`}</div></div>
      <h2 style="color:${won ? "#7bd389" : "#ff8a70"}">${won ? "ÉCOVILLE EST SAUVÉE !" : "PRESQUE !"}</h2>
      <div class="podium">${ranked.map((r, n) => `<div class="team">${n === 0 ? `<span class="crown">CHAMPIONS</span>` : ""}${avatar(r.t.name, r.t.color)}<span class="nm">${n + 1}. ${esc(r.t.name)}</span><span class="sc">${r.t.score}</span><div class="sub">points</div></div>`).join("")}</div>
      <div class="row"><button class="btn green big" id="again">REJOUER</button><button class="btn white" id="tolobby">Accueil</button></div></div>
      <div class="city">${G.districts.map(d => tile(d, false)).join("")}</div>`;
  }
  return `${topbar()}<section class="game"><div class="stage">${stage}</div>${teamsPanel()}</section>`;
}

let confirmQuit = false;
function render() {
  if (MODE !== "host") return;
  const app = $("#app");
  const focused = document.activeElement && document.activeElement.id;
  app.innerHTML = G.phase === "lobby" ? renderLobby() : renderGame();
  if (focused && focused.startsWith("tn") && $("#" + focused)) { const el = $("#" + focused); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  $("#sound")?.addEventListener("click", () => { soundOn = !soundOn; store.set("ecoville-sound", soundOn); initAudio(); if (soundOn) sfx.pick(); render(); });
  if (G.phase === "lobby") {
    const qrEl = $("#qr");
    if (qrEl && typeof qrcode !== "undefined") { const qr = qrcode(0, "M"); qr.addData(phoneUrl()); qr.make(); qrEl.innerHTML = qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); }
    ["year", "nteams", "rounds", "timer"].forEach(id => $("#" + id).addEventListener("change", e => {
      const v = +e.target.value; ({ year: () => G.year = v, nteams: () => G.nTeams = v, rounds: () => G.rounds = v, timer: () => G.timer = v })[id]();
      saveSetup(); render();
    }));
    app.querySelectorAll("[id^=tn]").forEach(el => el.addEventListener("input", e => { G.names[+e.target.dataset.i] = e.target.value; saveSetup(); }));
    app.querySelectorAll("[id^=tn]").forEach(el => el.addEventListener("change", () => render()));
    $("#start").addEventListener("click", startGame);
  } else {
    app.querySelectorAll("button.tile[data-k]").forEach(b => b.addEventListener("click", () => chooseDistrict(b.dataset.k)));
    app.querySelectorAll(".manual button").forEach(b => b.addEventListener("click", () => setAnswer(+b.dataset.team, +b.dataset.a, true)));
    $("#next")?.addEventListener("click", afterReveal);
    $("#evnext")?.addEventListener("click", nextRound);
    $("#revealnow")?.addEventListener("click", reveal);
    $("#again")?.addEventListener("click", startGame);
    $("#tolobby")?.addEventListener("click", () => { G.phase = "lobby"; G.districts = DISTRICTS.map(d => ({ ...d, h: START_HEALTH })); $("#confetti").innerHTML = ""; render(); });
    const quit = $("#quit");
    if (quit) {
      if (confirmQuit) { quit.textContent = "Confirmer l'arrêt ?"; quit.style.background = "#ff8a70"; }
      quit.addEventListener("click", () => {
        if (!confirmQuit) { confirmQuit = true; render(); setTimeout(() => { confirmQuit = false; if (G.phase !== "lobby") render(); }, 4000); return; }
        confirmQuit = false; clearInterval(tickHandle); G.phase = "lobby"; G.districts = DISTRICTS.map(d => ({ ...d, h: START_HEALTH })); render();
      });
    }
  }
  broadcast();
}

// =====================================================================
//  MODE TÉLÉPHONE (manette d'équipe)
// =====================================================================
const P = { room: null, team: null, view: null, conn: null, peer: null, status: "connexion", answered: null, localLeft: 0, timer: null };

function startPhone(room) {
  P.room = room.toUpperCase();
  const mem = store.get("ecoville-phone");
  if (mem && mem.room === P.room) P.team = mem.team;
  renderPhone();
  if (typeof Peer === "undefined") { P.status = "indisponible"; return renderPhone(); }
  P.peer = new Peer({ debug: 0 });
  P.peer.on("open", connectPhone);
  P.peer.on("error", e => { if (e.type === "peer-unavailable") { P.status = "salle introuvable"; renderPhone(); setTimeout(connectPhone, 4000); } });
  P.peer.on("disconnected", () => { try { P.peer.reconnect(); } catch {} });
}
function connectPhone() {
  if (P.conn && P.conn.open) return;
  P.status = "connexion"; renderPhone();
  const conn = P.peer.connect(PEER_PREFIX + P.room.toLowerCase(), { reliable: true });
  P.conn = conn;
  conn.on("open", () => { P.status = "connecté"; if (P.team != null) conn.send({ t: "join", team: P.team }); conn.send({ t: "hello" }); });
  conn.on("data", v => { onView(v); });
  conn.on("close", () => { P.status = "reconnexion"; renderPhone(); setTimeout(connectPhone, 2500); });
}
function send(msg) { if (P.conn && P.conn.open) try { P.conn.send(msg); } catch {} }
function onView(v) {
  if (!v || typeof v !== "object") return;
  const prev = P.view;
  P.view = v;
  if (P.team != null && v.team == null) send({ t: "join", team: P.team });
  if (v.q && (!prev || !prev.q || prev.q.qid !== v.q.qid)) { P.answered = v.q.mine; startLocalTimer(v.q.left); try { navigator.vibrate?.(120); } catch {} }
  if (v.phase === "reveal" && prev && prev.phase !== "reveal") { try { navigator.vibrate?.(v.res && v.res.ok ? [60, 40, 60] : 200); } catch {} }
  renderPhone();
}
function startLocalTimer(s) {
  clearInterval(P.timer); P.localLeft = s;
  P.timer = setInterval(() => { P.localLeft = Math.max(0, P.localLeft - 1); const el = $("#phleft"); if (el) el.textContent = P.localLeft; if (!P.localLeft) clearInterval(P.timer); }, 1000);
}

function renderPhone() {
  const app = $("#app"), v = P.view;
  const connCls = P.status === "connecté" ? "" : "off";
  const mascotSm = MASCOT.replace('class="mascot"', 'class="mascot sm"');
  let body = "";
  if (!v) {
    const msg = P.status === "indisponible" ? "Connexion impossible depuis ce navigateur." : P.status === "salle introuvable" ? `Salle ${esc(P.room)} introuvable. Vérifie le code au tableau, nouvel essai…` : "Connexion à la salle…";
    body = `<div class="talk">${mascotSm}<div class="bubble">${msg}</div></div>`;
  } else if (P.team == null) {
    body = `<div class="talk">${mascotSm}<div class="bubble">Salut ! Quelle est ton équipe ?</div></div>
      <div class="ph-pick">${v.teams.map((t, i) => `<button data-team="${i}" style="background:${t.color}"><span class="nmx">${esc(t.name)}<small>${t.phone ? "déjà un téléphone" : "libre"}</small></span></button>`).join("")}</div>`;
  } else {
    const t = v.teams[P.team] || { name: "?", color: "#777" };
    const head = `<div class="ph-team" style="background:${t.color}">${avatar(t.name, t.color)}<span>${esc(t.name)}</span><span class="sc">${v.me ? v.me.score + " PTS · " + v.me.rank + "E" : ""}</span></div>`;
    if (v.phase === "lobby") body = head + `<div class="talk">${mascotSm}<div class="bubble">C'est prêt ! Regardez le tableau, la partie va commencer.</div></div><button class="btn white small" id="change">Changer d'équipe</button>`;
    else if (v.phase === "choose" && v.isChooser) body = head + `<div class="ph-big">À vous de choisir le quartier !</div><p class="ph-sub">Votre bonne réponse comptera double.</p>
      <div class="ph-pick">${v.districts.map(d => `<button data-k="${d.k}" style="background:${DMAP[d.k].color}"><div class="scene" style="--h:${d.h / 100};--b:${d.h >= GOAL ? 1 : 0}">${SCENES[d.k]}</div><span class="nmx">${esc(d.name)}<small>${esc(d.theme)} · ${d.h} %</small></span></button>`).join("")}</div>`;
    else if (v.phase === "choose") body = head + `<div class="talk">${mascotSm}<div class="bubble">${esc(v.chooserName)} choisit un quartier… Préparez-vous !</div></div>`;
    else if (v.phase === "question") {
      const done = P.answered != null;
      body = head + `<div class="row" style="justify-content:space-between"><span class="label">${esc(v.q.district.toUpperCase())}</span><span class="ph-timer" id="phleft">${P.localLeft}</span></div>
        <div class="ph-q">${esc(v.q.text)}</div>
        <div class="ph-ans">${v.q.opts.map((o, k) => `<button class="k${k + 1} ${P.answered === k ? "sel" : ""}" data-a="${k}" ${done ? "disabled" : ""}><span class="k">${LETTERS[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
        ${done ? `<p class="ph-sub">Réponse envoyée ! Regardez le tableau.</p>` : ""}`;
    } else if (v.phase === "reveal") {
      const r = v.res;
      body = head + `<div class="ph-res ${r.ok == null ? "none" : r.ok ? "ok" : "ko"}"><div class="big">${r.ok == null ? "TROP TARD !" : r.ok ? "BRAVO ! +" + r.gain : "RATÉ…"}</div>
        <p style="margin:10px 0 0;font-weight:800">Bonne réponse : ${esc(r.correct)}</p></div><p class="ph-sub">${esc(r.expl)}</p>`;
    } else if (v.phase === "event") body = head + `<div class="panel news ${v.event.good ? "good" : ""}"><span class="flash">${v.event.good ? "BONNE NOUVELLE" : "FLASH INFO"}</span><h2 style="font-size:2rem">${esc(v.event.title.toUpperCase())}</h2><p style="font-size:1rem">${esc(v.event.text)}</p></div>`;
    else if (v.phase === "end") body = head + `<div class="talk">${mascotSm}<div class="bubble">${v.won ? "Écoville est sauvée, bravo !" : "Fin de la quête !"} Votre équipe termine ${v.me.rank}e avec ${v.me.score} points.</div></div>`;
  }
  app.innerHTML = `<div class="phone">
    <div class="ph-head"><span class="logo">ÉCO<span class="v">VILLE</span></span><span class="ph-conn ${connCls}">SALLE ${esc(P.room)} · ${esc(P.status.toUpperCase())}</span></div>
    ${body}</div>`;
  app.querySelectorAll(".ph-pick button[data-team]").forEach(b => b.addEventListener("click", () => {
    P.team = +b.dataset.team; store.set("ecoville-phone", { room: P.room, team: P.team }); send({ t: "join", team: P.team }); renderPhone();
  }));
  app.querySelectorAll(".ph-pick button[data-k]").forEach(b => b.addEventListener("click", () => send({ t: "pick", k: b.dataset.k })));
  app.querySelectorAll(".ph-ans button").forEach(b => b.addEventListener("click", () => {
    if (P.answered != null) return; P.answered = +b.dataset.a; send({ t: "ans", i: P.answered, qid: P.view.q.qid }); renderPhone();
  }));
  $("#change")?.addEventListener("click", () => { P.team = null; store.set("ecoville-phone", null); renderPhone(); });
}

// =====================================================================
//  DÉMARRAGE
// =====================================================================
const params = new URLSearchParams(location.search);
const MODE = params.get("salle") ? "phone" : "host";
if (MODE === "phone") startPhone(params.get("salle"));
else { render(); startHost(); }
</script>
